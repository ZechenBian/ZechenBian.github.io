schema_version: "1.1"
name: unattended-report-only
expected_outcome: |
  判断今天是 11 月最后一个周二，窗口从 2026-10-28 到 2026-11-24。写出一份 Markdown 月报：最前面是四行顶块，正文六节顺序固定（做了什么、评判、待决池、skill 建议、工作流改动、下月三件事），条目带编号和“批示”列。评判里局部逐项目写目标、实际、不足、证据和反方理由；整体对照用户自己说的长期目标，并回顾上期 F1（外部试玩反馈）的指标。待决池把上期带来的 D1（第 3 期搁置，推荐放弃或写明重启条件）和本月的搁置、暂缓合在一张表里。skill 建议只建议、不动手。不出存档，不改任何别的东西；结尾说明发了或应发通知。
context:
  scaffold_script: place-files.sh
