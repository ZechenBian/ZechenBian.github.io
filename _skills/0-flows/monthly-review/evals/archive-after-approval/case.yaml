schema_version: "1.1"
name: archive-after-approval
expected_outcome: |
  读批完的月报，写出“月度存档 · 2026-11”的 Markdown 文件，按固定的八部分顺序：三行摘要、元信息、本月事实、评判定稿、决定台账、待决池现状、下月焦点与指标、指标基线。决定台账逐条记下 P1、P2、D1–D3、F1–F3 的批示，含不做、暂缓、改后采纳的内容；没批的 D3 记“未批”，不替用户批。用户对“顺序反了”的反驳写成“用户意见”，同时保留原判断和理由。指标基线写出可供下期对照的数字（例如有动作的项目 4、上线 2、提交 8、PR 3、外部反馈 0）。不改月报本身。
context:
  scaffold_script: place-files.sh
