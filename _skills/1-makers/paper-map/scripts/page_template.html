<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#fbfaf7; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc; --soft:#f2f0ea;
  --accent:#2f5d8a; --warn:#a4462c; --ok:#2e7d4f;
  --c-TW03:#8a6a1f; --c-T14:#2f66b0; --c-BDG15:#c0502a; --c-BFN16:#2b8a57; --c-T18:#7a4ea6; --c-T22:#b4336a; --c-GMP23:#1d8799;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
header{padding:14px 20px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
nav{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:5px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{display:grid;grid-template-columns:230px 1fr 380px;height:calc(100% - 92px);min-height:520px}
aside{overflow:auto;padding:14px;background:var(--panel)}
#left{border-right:1px solid var(--line)}
#detail{border-left:1px solid var(--line)}
.stage{position:relative;overflow:hidden;background:var(--bg)}
.stage svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.stage svg.drag{cursor:grabbing}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.tools button,.btn{border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:6px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
.tools button:hover,.btn:hover{border-color:var(--ink)}
.stage .caption{position:absolute;left:12px;top:10px;font-size:12.5px;color:var(--muted);background:rgba(251,250,247,.9);padding:2px 6px;border-radius:4px;max-width:60%}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px;font-weight:600}
h2:first-child{margin-top:0}
.plist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:5px 6px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.plist button:hover{background:var(--soft)}
.plist button.on{border-color:var(--line);background:var(--soft);font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.plist small{color:var(--muted);margin-left:auto;font-size:11.5px}
input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;background:var(--bg)}
#results{margin-top:6px;max-height:220px;overflow:auto}
#results div{padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12.5px;line-height:1.35}
#results div:hover{background:var(--soft)}
label.ck{display:flex;gap:6px;align-items:center;font-size:12.5px;margin:3px 0;cursor:pointer}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:3px 0}
.legend svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;color:#fff}
.nid{font-family:var(--mono);font-size:12.5px}
.meta{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.stmt{font-size:14px;line-height:1.55;padding:10px 12px;background:var(--soft);border-radius:8px;overflow-x:auto}
.intu{margin-top:10px;font-size:13px;line-height:1.55;padding:10px 12px;border-left:3px solid var(--accent);background:#eef3f8;border-radius:0 8px 8px 0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.main{border-color:var(--ink);color:var(--ink);font-weight:600}
.badge.idea{border-color:var(--accent);color:var(--accent);font-weight:600}
.badge.warn{border-color:var(--warn);color:var(--warn)}
ul.rel{list-style:none;padding:0;margin:4px 0}
ul.rel li{padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px;line-height:1.4}
ul.rel li:last-child{border-bottom:none}
a.nl{color:var(--accent);cursor:pointer;text-decoration:none;font-family:var(--mono);font-size:12px}
a.nl:hover{text-decoration:underline}
.ev{color:var(--muted);font-size:12px}
.type{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
ol.path{padding-left:22px;margin:6px 0}
ol.path li{font-size:12.5px;margin:3px 0}
.empty{color:var(--muted);font-size:13px}
.page{padding:20px 28px;overflow:auto;height:calc(100% - 92px);max-width:1100px}
.page h3{font-size:16px;margin:22px 0 8px}
.page p{max-width:760px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.ok{color:var(--ok)} .bad{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h4{margin:0 0 4px;font-size:14px}
.hidden{display:none!important}
.node rect{stroke-width:1.2}
.node text{font:11px var(--mono);pointer-events:none}
.node{cursor:pointer}
.node.fade{opacity:.18}
.edge{fill:none}
.edge.fade{opacity:.06}
.edge.hl{stroke-width:2.2!important;opacity:1}

.story{max-width:780px;margin:0 auto;font-size:15px;line-height:1.68}
.story .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.story h1.st-title{font-size:26px;line-height:1.25;margin:6px 0 14px;letter-spacing:-.015em}
.story .lede{font-size:16.5px;line-height:1.65}
.story .howto{font-size:13px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.story h2.act{font-size:20px;margin:34px 0 8px;padding-top:14px;border-top:1px solid var(--line);text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.story h3{font-size:16px;margin:22px 0 6px}
.story a[data-node],.story a[data-path]{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--accent);white-space:nowrap}
.story a.pl{font-size:12px;margin-left:6px}
.story .pbox{cursor:pointer}.story .pbox:hover rect{fill:#f7f7f5}
.sumbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 20px 12px;margin:18px 0}
.sumbox h2{font-size:12px;margin:12px 0 4px}
.sumbox dt{font-weight:650;margin-top:10px}.sumbox dd{margin:2px 0 0 0}
.lab{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px;border:1px solid;vertical-align:1px;margin:0 2px;white-space:nowrap}
.lab.proved{color:#2e7d4f;border-color:#9fd0b2;background:#eef8f2}.lab.sketch{color:#9a6a12;border-color:#e6c98f;background:#fdf6e7}
.lab.phys{color:#7a4ea6;border-color:#cdb6e4;background:#f6f1fb}.lab.conj{color:#a4462c;border-color:#e6b4a4;background:#fcf1ed}
.lab.heur{color:#6b6b70;border-color:#d5d3cd;background:#f4f3ef}.lab.claude{color:#2f5d8a;border-color:#a9c2dc;background:#eef3f8}
.story .quote{font-size:17px;font-style:italic;border-left:3px solid var(--c-T18);padding:4px 14px;color:#333}
.story .ex{background:var(--soft);border-radius:8px;padding:8px 12px}
.story figure{margin:18px 0}.story figure svg.fig{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.story figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.story .ctl{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;margin-bottom:6px}
.story .ctl input{vertical-align:middle;width:150px}
.story ul.claims li{margin:8px 0}
.story ol.steps li{margin:10px 0}
.story h3{font-size:16.5px;margin:26px 0 6px}
.story table.spine td,.story table.spine th{font-size:13px}
.story details.appendix{margin:16px 0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--panel)}
.story details.appendix summary{cursor:pointer;font-weight:600}
#v-story{max-width:none}
@media (max-width:1100px){.wrap{grid-template-columns:200px 1fr 320px}}
@media (max-width:820px){.wrap{grid-template-columns:1fr;height:auto}.stage{height:70vh}#left,#detail{border:none}}
</style>

<body>
<header>
  <h1 id="h1title">__TITLE__</h1>
  <div class="sub" id="sub"></div>
  <nav id="tabs">
    <button data-v="story" class="on">Story</button>
    <button data-v="map">Map</button>
    <button data-v="results">Main results &amp; idea entries</button>
    <button data-v="links">Cross-paper citations</button>
    <button data-v="gaps">Open problems</button>
    <button data-v="caveats">Coverage &amp; caveats</button>
  </nav>
</header>

<div class="page" id="v-story">__STORY__</div>
<div class="wrap hidden" id="v-map">
  <aside id="left">
    <h2>Scope</h2>
    <div class="plist" id="plist"></div>
    <h2>Find</h2>
    <input type="search" id="q" placeholder="id or words in a statement">
    <div id="results"></div>
    <h2>Show</h2>
    <label class="ck"><input type="checkbox" id="ckAuthor" checked> “author: agrees / generalises” edges</label>
    <label class="ck"><input type="checkbox" id="ckIso"> nodes with no edges</label>
    <h2>Legend</h2>
    <div class="legend" id="legend"></div>
  </aside>
  <section class="stage">
    <svg id="svg"><g id="vp"></g></svg>
    <div class="caption" id="caption"></div>
    <div class="tools"><button id="fit">Fit</button><button id="zin">+</button><button id="zout">−</button></div>
  </section>
  <aside id="detail"><div class="empty">Click a node to see its statement, page, what it depends on and what uses it. Foundations sit at the top; results lower down.</div></aside>
</div>

<div class="page hidden" id="v-results"></div>
<div class="page hidden" id="v-links"></div>
<div class="page hidden" id="v-gaps"></div>
<div class="page hidden" id="v-caveats"></div>

<script id="data" type="application/json">__DATA__</script>
<script id="check" type="application/json">__CHECK__</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
let CHECK = null; try { CHECK = JSON.parse(document.getElementById('check').textContent); } catch(e) {}
const ORDER = D.batch.map(b=>b.key);
const PAPER = Object.fromEntries(D.batch.map(b=>[b.key,b]));
const SHORT = (D.corpus && D.corpus.short) || {};
const PALETTE = ["#8a6a1f","#2f66b0","#c0502a","#2b8a57","#7a4ea6","#b4336a","#1d8799","#5b6b1e","#a0522d","#4b5bb5","#8c3b8c","#2f7f6f"];
(D.corpus && D.corpus.colors ? Object.entries(D.corpus.colors) : ORDER.map((k,i)=>[k,PALETTE[i%PALETTE.length]])).forEach(([k,c])=>document.documentElement.style.setProperty("--c-"+k,c));
const col = k => getComputedStyle(document.documentElement).getPropertyValue('--c-'+k).trim() || '#888';
const N = new Map(D.nodes.map(n=>[n.id,n]));
const DEP = new Set(["used in proof","used in definition"]);
const parents = new Map(), children = new Map();
D.nodes.forEach(n=>{parents.set(n.id,[]);children.set(n.id,[]);});
D.edges.forEach(e=>{ if(!N.has(e.from)||!N.has(e.to)) return; parents.get(e.to).push(e); children.get(e.from).push(e); });
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => { const x=document.createElement(tag); if(attrs) for(const [k,v] of Object.entries(attrs)){ if(k==='class') x.className=v; else if(k==='text') x.textContent=v; else if(k.startsWith('on')) x.addEventListener(k.slice(2),v); else x.setAttribute(k,v);} kids.flat().forEach(c=>{ if(c==null) return; x.appendChild(typeof c==='string'?document.createTextNode(c):c);}); return x; };
const SVGNS="http://www.w3.org/2000/svg";
const sv = (tag, attrs) => { const x=document.createElementNS(SVGNS,tag); for(const [k,v] of Object.entries(attrs||{})) x.setAttribute(k,v); return x; };
const label = id => { const [p,r]=id.split(':'); return r.replace(/^([A-Za-z]+)(\d)/,'$1 $2').replace(/^p(\d+)-([a-z])$/,'p.$1$2'); };
const KMACROS={'\\Spec':'\\operatorname{Spec}','\\Bun':'\\operatorname{Bun}','\\Hom':'\\operatorname{Hom}','\\End':'\\operatorname{End}','\\Ind':'\\operatorname{Ind}','\\Coh':'\\operatorname{Coh}','\\QCoh':'\\operatorname{QCoh}'};
const typeset = node => { if(!node || !window.renderMathInElement) return; try { renderMathInElement(node,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false,strict:'ignore',ignoredClasses:['tex2jax_ignore'],macros:Object.assign({},KMACROS)}); } catch(e){} };
const natural = (a,b) => a.localeCompare(b, undefined, {numeric:true});

/* header */
const nCross = D.edges.filter(e=>e.cross).length;
$('sub').textContent = `${ORDER.length} papers · ${D.nodes.length} results, definitions and claims · ${D.edges.length} dependency edges (${nCross} across papers) · every edge points to a page in the source. Built from the papers' own text; proofs are not verified.`;
((D.corpus&&D.corpus.links)||[]).forEach(l=>{ const a=document.createElement('a'); a.href=l.url; a.textContent=l.title; a.target='_blank'; a.rel='noopener'; $('sub').append(' · ', a); });

/* tabs */
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  showView(b.dataset.v);
}));

function showView(v){
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  ['story','map','results','links','gaps','caveats'].forEach(x=>$('v-'+x).classList.toggle('hidden', x!==v));
  if(v==='map') draw(); else typeset($('v-'+v));
}
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('[data-tab],[data-gap]');
  if(tb){ ev.preventDefault(); showView(tb.dataset.tab||'gaps'); if(tb.dataset.gap){ const c=document.getElementById('gap-'+tb.dataset.gap); if(c) c.scrollIntoView({block:'start'}); } return; }
  const a=ev.target.closest('[data-node],[data-path]'); if(!a || a.closest('#v-map')) return;
  ev.preventDefault();
  if(a.dataset.path){ showView('map'); setScope({kind:'path',target:a.dataset.path}); return; }
  const n=N.get(a.dataset.node); if(!n) return;
  showView('map'); setScope({kind:'paper',paper:n.paper}); select(n.id,true);
});
/* left: scope list */
let scope = {kind:'overview'};
function renderPlist(){
  const box=$('plist'); box.innerHTML='';
  const mk=(txt,sub,c,on,fn)=>{ const b=el('button',{class:on?'on':'',onclick:fn}); if(c) b.appendChild(el('span',{class:'dot',style:'background:'+c})); b.appendChild(el('span',{text:txt})); if(sub) b.appendChild(el('small',{text:sub})); box.appendChild(b); };
  mk('Overview: papers','',null,scope.kind==='overview',()=>setScope({kind:'overview'}));
  ORDER.forEach(k=>mk(k, D.nodes.filter(n=>n.paper===k).length+'', col(k), scope.kind==='paper'&&scope.paper===k, ()=>setScope({kind:'paper',paper:k})));
  if(scope.kind==='path') mk('Reading path → '+scope.target,'',null,true,()=>{});
}
const legend=$('legend');
[["proof uses","#8d8d93",""],["definition uses","#8d8d93","5 4"],["cross-paper","#2f5d8a",""],["author: agrees / generalises","#9b6bc4","2 3"]].forEach(([t,c,d])=>{
  const s=sv('svg',{width:34,height:10}); s.appendChild(sv('line',{x1:2,y1:5,x2:32,y2:5,stroke:c,'stroke-width':t==='cross-paper'?2.4:1.6,'stroke-dasharray':d})); legend.appendChild(el('div',null,s,t)); });
legend.appendChild(el('div',null,'Thick border = main result · ★ = idea entry · dashed box = node from another paper'));

/* search */
$('q').addEventListener('input',()=>{
  const q=$('q').value.trim().toLowerCase(); const r=$('results'); r.innerHTML='';
  if(q.length<2) return;
  D.nodes.filter(n=>n.id.toLowerCase().includes(q)||(n.statement||'').toLowerCase().includes(q)).slice(0,40).forEach(n=>{
    r.appendChild(el('div',{onclick:()=>{ if(scope.kind!=='paper'||scope.paper!==n.paper) setScope({kind:'paper',paper:n.paper}); select(n.id,true);} },
      el('span',{class:'nid',text:n.id}),' ',el('span',{class:'ev',text:(n.statement||'').slice(0,70)+((n.statement||'').length>70?'…':'')})));
  });
});
$('ckAuthor').addEventListener('change',()=>draw());
$('ckIso').addEventListener('change',()=>draw());

/* ---------- layout ---------- */
const W=96,H=26,GX=14,GY=46;
function ancestors(id){ const seen=new Set(), st=[id]; while(st.length){ const x=st.pop(); if(seen.has(x)) continue; seen.add(x); parents.get(x).forEach(e=>{ if(DEP.has(e.type)) st.push(e.from); }); } return seen; }
function layered(ids){
  const S=new Set(ids), depth=new Map();
  const dfs=(x,stack=new Set())=>{ if(depth.has(x)) return depth.get(x); if(stack.has(x)) return 0; stack.add(x);
    let d=0; parents.get(x).forEach(e=>{ if((DEP.has(e.type)||e.cross)&&S.has(e.from)) d=Math.max(d,1+dfs(e.from,stack)); }); stack.delete(x); depth.set(x,d); return d; };
  ids.forEach(x=>dfs(x));
  const layers=[]; ids.forEach(x=>{ const d=depth.get(x); (layers[d]=layers[d]||[]).push(x); });
  layers.forEach(L=>L.sort(natural));
  const pos=new Map(); const idx=()=>layers.forEach(L=>L.forEach((x,i)=>pos.set(x,i)));
  idx();
  for(let it=0;it<4;it++){
    for(let d=1;d<layers.length;d++){ const L=layers[d]; if(!L) continue;
      const bc=x=>{ const ps=parents.get(x).filter(e=>S.has(e.from)).map(e=>pos.get(e.from)); return ps.length? ps.reduce((a,b)=>a+b,0)/ps.length : pos.get(x); };
      const m=new Map(L.map(x=>[x,bc(x)])); L.sort((a,b)=>m.get(a)-m.get(b)); L.forEach((x,i)=>pos.set(x,i)); }
    for(let d=layers.length-2;d>=0;d--){ const L=layers[d]; if(!L) continue;
      const bc=x=>{ const cs=children.get(x).filter(e=>S.has(e.to)).map(e=>pos.get(e.to)); return cs.length? cs.reduce((a,b)=>a+b,0)/cs.length : pos.get(x); };
      const m=new Map(L.map(x=>[x,bc(x)])); L.sort((a,b)=>m.get(a)-m.get(b)); L.forEach((x,i)=>pos.set(x,i)); }
  }
  const maxw=Math.max(...layers.map(L=>L?L.length:0));
  const xy=new Map();
  layers.forEach((L,d)=>{ if(!L) return; const off=(maxw-L.length)*(W+GX)/2; L.forEach((x,i)=>xy.set(x,{x:off+i*(W+GX),y:d*(H+GY)})); });
  return {xy, width:maxw*(W+GX), height:layers.length*(H+GY)};
}

/* ---------- drawing ---------- */
const svg=$('svg'), vp=$('vp');
let view={x:0,y:0,w:1000,h:700}, content={w:1000,h:700}, current=null;
function setVB(){ svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`); }
function fit(){ const r=svg.getBoundingClientRect(); if(!r.width||!r.height) return; const pad=40, top=110; const cw=content.w+2*pad, ch=content.h+pad+top; const s=Math.max(cw/r.width, ch/r.height, 0.6);
  view={w:r.width*s,h:r.height*s,x:-pad-(r.width*s-cw)/2,y:-top}; setVB(); }
function zoom(f,cx,cy){ const r=svg.getBoundingClientRect(); if(cx==null){cx=r.width/2;cy=r.height/2;}
  const px=view.x+cx/r.width*view.w, py=view.y+cy/r.height*view.h; view.w*=f; view.h*=f; view.x=px-cx/r.width*view.w; view.y=py-cy/r.height*view.h; setVB(); }
svg.addEventListener('wheel',ev=>{ ev.preventDefault(); const r=svg.getBoundingClientRect(); zoom(ev.deltaY>0?1.12:1/1.12, ev.clientX-r.left, ev.clientY-r.top); },{passive:false});
let drag=null;
svg.addEventListener('pointerdown',ev=>{ if(ev.target.closest('.node')) return; drag={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y}; svg.classList.add('drag'); svg.setPointerCapture(ev.pointerId); });
svg.addEventListener('pointermove',ev=>{ if(!drag) return; const r=svg.getBoundingClientRect(); view.x=drag.vx-(ev.clientX-drag.x)/r.width*view.w; view.y=drag.vy-(ev.clientY-drag.y)/r.height*view.h; setVB(); });
svg.addEventListener('pointerup',()=>{ drag=null; svg.classList.remove('drag'); });

function drawOverview(){

  const BW=170,BH=64, pos={}; ORDER.forEach((k,i)=>{ pos[k]={x:i*215, y:(i%2)*170}; });
  const defs=sv('defs'); const mk=sv('marker',{id:'arr',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'}); mk.appendChild(sv('path',{d:'M0,0 L10,5 L0,10 z',fill:'#6b6b70'})); defs.appendChild(mk); vp.appendChild(defs);
  Object.entries(cnt).forEach(([k,v])=>{ const [a,b]=k.split('>'); const A=pos[a],B=pos[b]; if(!A||!B) return;
    const x1=A.x+BW/2,y1=A.y+BH/2,x2=B.x+BW/2,y2=B.y+BH/2; const mx=(x1+x2)/2, my=Math.min(y1,y2)-60-Math.abs(x2-x1)*0.12;
    const p=sv('path',{d:`M${x1},${y1} Q${mx},${my} ${x2},${y2}`,class:'edge',stroke:col(a),'stroke-width':1+Math.sqrt(v.n)*1.3,opacity:.75,'marker-end':'url(#arr)'});
    const t=sv('title'); t.textContent=`${b} cites ${a}: ${v.n} (${Object.entries(v.types).map(([x,y])=>y+' '+x).join(', ')})`; p.appendChild(t); vp.appendChild(p);
    const lt=sv('text',{x:mx,y:(y1+y2)/2/2+my/2,'text-anchor':'middle','font-size':11,fill:col(a)}); lt.textContent=v.n; vp.appendChild(lt); });
  ORDER.forEach(k=>{ const g=sv('g',{class:'node',transform:`translate(${pos[k].x},${pos[k].y})`});
    g.appendChild(sv('rect',{width:BW,height:BH,rx:10,fill:'#fff',stroke:col(k),'stroke-width':2}));
    const t1=sv('text',{x:12,y:24,'font-weight':700,fill:col(k),style:'font:600 14px var(--font)'}); t1.textContent=k; g.appendChild(t1);
    const t2=sv('text',{x:12,y:42,style:'font:11px var(--font)',fill:'#555'}); t2.textContent=SHORT[k]; g.appendChild(t2);
    const t3=sv('text',{x:12,y:56,style:'font:10.5px var(--font)',fill:'#888'}); t3.textContent=D.nodes.filter(n=>n.paper===k).length+' nodes · '+D.nodes.filter(n=>n.paper===k&&n.main).length+' main results'; g.appendChild(t3);
    g.addEventListener('click',()=>setScope({kind:'paper',paper:k})); vp.appendChild(g); });
  content={w:ORDER.length*215,h:300};
  $('caption').textContent='Arrow A → B: paper B cites paper A for something other than background (width ∝ number of citations; hover for the breakdown). Most cross-paper citations name a paper, not a numbered result — see “Cross-paper citations”. Click a paper to open its map.';
  fit();
  $('detail').innerHTML=''; $('detail').appendChild(overviewDetail()); typeset($('detail'));
}
function overviewDetail(){

  box.appendChild(el('p',{style:'font-size:13px;margin:0 0 8px',text:'Each paper was read in full and broken into numbered results, definitions, constructions and (for physics) claims. An edge A → B means the text establishing B uses A, with the page where it does. Edges between papers are drawn only when a paper cites a specific numbered item of another paper in this batch.'}));

function nodeLink(id, openPaper){ const n=N.get(id); return el('a',{class:'nl',text:id,title:n?(n.statement||'').slice(0,160):'',onclick:()=>{ if(!n) return; if(openPaper && (scope.kind!=='paper'||scope.paper!==n.paper) && !(scope.kind==='path' && current && current.has(id))) setScope({kind:'paper',paper:n.paper}); select(id,true);} }); }

function draw(){
  if(scope.kind==='overview') return drawOverview();
  let ids;
  if(scope.kind==='paper'){
    const own=D.nodes.filter(n=>n.paper===scope.paper).map(n=>n.id);
    const ghosts=new Set();
    own.forEach(id=>{ parents.get(id).forEach(e=>{ if(e.cross) ghosts.add(e.from); }); children.get(id).forEach(e=>{ if(e.cross) ghosts.add(e.to); }); });
    ids=own.concat([...ghosts]);
    if(!$('ckIso').checked){ const S=new Set(ids); ids=ids.filter(id=>parents.get(id).some(e=>S.has(e.from))||children.get(id).some(e=>S.has(e.to))||N.get(id).main); }
    $('caption').textContent=`${scope.paper} — ${SHORT[scope.paper]}. Foundations at the top, results lower down. Dashed boxes are results of other papers linked by an explicit numbered citation. Drag to pan, scroll to zoom.`;
  } else {
    ids=[...ancestors(scope.target)];
    $('caption').textContent=`Reading path to ${scope.target}: everything it depends on (by proof or definition), across papers. Read top to bottom; the numbered list is in the side panel.`;
  }
  current=new Set(ids);
  const L=layered(ids); content={w:L.width,h:L.height};
  vp.innerHTML='';
  const showAuthor=$('ckAuthor').checked;
  const eg=sv('g'); vp.appendChild(eg);
  D.edges.forEach(e=>{ if(!current.has(e.from)||!current.has(e.to)) return; if(!DEP.has(e.type)&&!showAuthor) return;
    const a=L.xy.get(e.from), b=L.xy.get(e.to); const x1=a.x+W/2,y1=a.y+H,x2=b.x+W/2,y2=b.y;
    let d; if(y2>y1) d=`M${x1},${y1} C${x1},${y1+GY*.6} ${x2},${y2-GY*.6} ${x2},${y2}`; else d=`M${x1},${a.y} C${x1-60},${a.y-50} ${x2-60},${y2+H+50} ${x2},${y2+H}`;
    const st = e.cross? {stroke:col(N.get(e.from).paper),'stroke-width':2.2} : DEP.has(e.type)? {stroke:'#a9a9ae','stroke-width':1.1,'stroke-dasharray':e.type==='used in definition'?'5 4':''} : {stroke:'#9b6bc4','stroke-width':1.3,'stroke-dasharray':'2 3'};
    const p=sv('path',Object.assign({d,class:'edge','data-f':e.from,'data-t':e.to},st)); const t=sv('title'); t.textContent=`${e.from} → ${e.to} (${e.type}) ${e.evidence||''}`; p.appendChild(t); eg.appendChild(p); });
  ids.forEach(id=>{ const n=N.get(id), p=L.xy.get(id); const ghost = scope.kind==='paper' && n.paper!==scope.paper;
    const g=sv('g',{class:'node','data-id':id,transform:`translate(${p.x},${p.y})`});
    g.appendChild(sv('rect',{width:W,height:H,rx:n.kind==='Definition'||n.kind==='Construction'?13:4,fill:ghost?'#fff':tint(col(n.paper)),stroke:col(n.paper),'stroke-width':n.main?2.6:1.1,'stroke-dasharray':ghost?'4 3':(n.kind==='Conjecture'?'3 2':'')}));
    const t=sv('text',{x:W/2,y:17,'text-anchor':'middle',fill:'#1d1d1f'}); t.textContent=(n.idea_entry?'★ ':'')+(scope.kind==='paper'&&!ghost?'':n.paper+' ')+label(id); if(t.textContent.length>15) t.setAttribute('textLength',W-8); g.appendChild(t);
    const tt=sv('title'); tt.textContent=`${id} · ${n.kind} · ${n.loc}\n${n.statement||''}`; g.appendChild(tt);
    g.addEventListener('click',ev=>{ ev.stopPropagation(); select(id,false); }); vp.appendChild(g); });
  fit();
  if(scope.kind==='paper' && !(sel && current.has(sel))) { $('detail').innerHTML=''; $('detail').appendChild(paperDetail(scope.paper)); typeset($('detail')); }
  if(sel && current.has(sel)) highlight(sel);
}
function tint(c){ const m=c.match(/#(..)(..)(..)/); if(!m) return '#f4f4f4'; const f=v=>Math.round(parseInt(v,16)*.14+255*.86); return `rgb(${f(m[1])},${f(m[2])},${f(m[3])})`; }
svg.addEventListener('click',ev=>{ if(!ev.target.closest('.node') && !drag){ sel=null; vp.querySelectorAll('.fade,.hl').forEach(x=>x.classList.remove('fade','hl')); } });

let sel=null;
function highlight(id){
  const near=new Set([id]); parents.get(id).forEach(e=>near.add(e.from)); children.get(id).forEach(e=>near.add(e.to));
  vp.querySelectorAll('.node').forEach(g=>g.classList.toggle('fade', !near.has(g.dataset.id)));
  vp.querySelectorAll('.edge').forEach(p=>{ const on=p.dataset.f===id||p.dataset.t===id; p.classList.toggle('hl',on); p.classList.toggle('fade',!on); });
}
function select(id, center){
  sel=id; const n=N.get(id);
  if(scope.kind!=='overview' && current && current.has(id)){ highlight(id);
    if(center){ const g=vp.querySelector(`.node[data-id="${CSS.escape(id)}"]`); if(g){ const m=g.getAttribute('transform').match(/translate\(([-\d.]+),([-\d.]+)\)/); view.x=+m[1]+W/2-view.w/2; view.y=+m[2]+H/2-view.h/2; setVB(); } } }
  const box=$('detail'); box.innerHTML=''; box.appendChild(nodeDetail(n)); typeset(box);
}
function nodeDetail(n){
  const box=el('div');
  box.appendChild(el('div',null, el('span',{class:'chip',style:'background:'+col(n.paper),text:n.paper}),' ',el('span',{class:'nid',text:n.id})));
  box.appendChild(el('div',{class:'meta',text:`${n.kind} · ${n.status} · ${n.loc}`}));
  const bd=el('div',{class:'badges'}); if(n.main) bd.appendChild(el('span',{class:'badge main',text:'main result'})); if(n.idea_entry) bd.appendChild(el('span',{class:'badge idea',text:'★ idea entry'}));
  if(n.status==='author calls it sketchy'||n.status==='stated without proof') bd.appendChild(el('span',{class:'badge warn',text:n.status}));
  const chk = CHECK && CHECK.items ? CHECK.items.filter(c=>c.node===n.id||c.edge_to===n.id) : [];
  chk.forEach(c=>bd.appendChild(el('span',{class:'badge '+(c.verdict==='holds'?'':'warn'),text:'checked: '+c.verdict})));
  if(n.corrected) bd.appendChild(el('span',{class:'badge warn',text:'corrected after check',title:n.corrected}));
  if(bd.childNodes.length) box.appendChild(bd);
  box.appendChild(el('div',{class:'stmt',text:n.statement||''}));
  if(n.intuition) box.appendChild(el('div',{class:'intu',text:n.intuition}));
  const acts=el('div',{style:'margin:10px 0;display:flex;gap:6px;flex-wrap:wrap'});
  acts.appendChild(el('button',{class:'btn',text:'Reading path to here',onclick:()=>setScope({kind:'path',target:n.id})}));
  if(scope.kind!=='paper'||scope.paper!==n.paper) acts.appendChild(el('button',{class:'btn',text:'Open in '+n.paper+' map',onclick:()=>{ setScope({kind:'paper',paper:n.paper}); select(n.id,true);} }));
  box.appendChild(acts);
  if(scope.kind==='path' && scope.target===n.id){
    const anc=ancestors(n.id); const L=layered([...anc]); const ord=[...anc].sort((a,b)=>(L.xy.get(a).y-L.xy.get(b).y)||(L.xy.get(a).x-L.xy.get(b).x));
    box.appendChild(el('h2',{text:`Reading order (${ord.length} items)`}));
    const ol=el('ol',{class:'path'}); ord.forEach(x=>{ const m=N.get(x); ol.appendChild(el('li',null,nodeLink(x,false),' ',el('span',{class:'ev',text:`${m.kind}, ${m.loc}`}))); }); box.appendChild(ol);
    const ext={}; anc.forEach(x=>N.get(x).outside.forEach(o=>{ (ext[o.ref]=ext[o.ref]||new Set()).add(x); }));
    const plinks=D.links.filter(l=>anc.has(l.from_node)&&l.use!=='background'&&!l.resolved.length);
    if(plinks.length){ box.appendChild(el('h2',{text:'Also leans on (paper-level, no numbered item)'})); const ul=el('ul',{class:'rel'}); plinks.forEach(l=>ul.appendChild(el('li',null,nodeLink(l.from_node,false),` ← ${l.to_paper} ${l.target||''}`,el('span',{class:'type',text:l.use}),el('div',{class:'ev',text:l.unresolved})))); box.appendChild(ul); }
    const ek=Object.keys(ext); if(ek.length){ box.appendChild(el('h2',{text:`Outside this batch (${ek.length})`})); const ul=el('ul',{class:'rel'}); ek.forEach(r=>ul.appendChild(el('li',null,el('div',{text:r||'(no reference text)'}),el('div',{class:'ev',text:'used by '+[...ext[r]].join(', ')})))); box.appendChild(ul); }
  }
  const sec=(title,list,fn)=>{ box.appendChild(el('h2',{text:`${title} (${list.length})`})); if(!list.length){ box.appendChild(el('div',{class:'empty',text:'—'})); return; } const ul=el('ul',{class:'rel'}); list.forEach(x=>ul.appendChild(fn(x))); box.appendChild(ul); };
  sec('Depends on', parents.get(n.id), e=>el('li',null,nodeLink(e.from,true),el('span',{class:'type',text:e.type+(e.cross?' · cross-paper':'')}),el('div',{class:'ev',text:e.evidence||''})));
  sec('Used by', children.get(n.id), e=>el('li',null,nodeLink(e.to,true),el('span',{class:'type',text:e.type+(e.cross?' · cross-paper':'')}),el('div',{class:'ev',text:e.evidence||''})));
  const pl=D.links.filter(l=>l.from_node===n.id);
  if(pl.length) sec('Citations of other papers in the batch', pl, l=>el('li',null,`${l.to_paper} ${l.target||''}`,el('span',{class:'type',text:l.use}),el('div',{class:'ev',text:`p. ${l.page}: “${l.phrase}”`}),el('div',{class:'ev',text:l.resolved.length?'linked to '+l.resolved.join(', '):l.unresolved})));
  if(n.outside.length) sec('Cites outside the batch', n.outside, o=>el('li',null,`[${o.key}] ${o.target||''}`,el('span',{class:'type',text:o.use}),el('div',{class:'ev',text:o.ref})));
  return box;
}
function paperDetail(k){
  const b=PAPER[k]; const box=el('div');
  box.appendChild(el('div',null,el('span',{class:'chip',style:'background:'+col(k),text:k})));

(function sqed(){
  const nS=$('sqN'), mS=$('sqM'), gS=$('sqG'); if(!nS) return;
  const fig=$('sqFig');
  function render(){
    const N=+nS.value, sp=+mS.value, G=+gS.value; fig.innerHTML='';
    const P=[]; for(let i=0;i<N;i++) P.push(sp*(i-(N-1)/2));
    const X=x=>40+(x+3)/6*420, Y0=95, K=34;
    const U=x=>G+P.reduce((a,p)=>a+(Math.abs(x-p)<1e-12?Infinity:1/Math.abs(x-p)),0);
    const r=x=>{ const u=U(x); return isFinite(u)?K/Math.sqrt(u):0; };
    const T=(x,y,txt,o)=>{ const t=sv('text',Object.assign({x,y,'font-size':11,fill:'#6b6b70'},o||{})); t.textContent=txt; fig.appendChild(t); };
    T(40,16,'metric picture: dual-photon circle over a line in the φ-plane (radius ∝ U^-1/2)');
    fig.appendChild(sv('line',{x1:X(-3),y1:Y0,x2:X(3),y2:Y0,stroke:'#c9c2d6'}));
    const xs=[...Array(301)].map((_,i)=>-3+6*i/300).concat(P).sort((u,v)=>u-v); let up='',dn=''; xs.forEach((x,i)=>{ const rr=r(x); up+=(i?'L':'M')+X(x).toFixed(1)+','+(Y0-rr).toFixed(1); dn+=(i?'L':'M')+X(x).toFixed(1)+','+(Y0+rr).toFixed(1); });
    fig.appendChild(sv('path',{d:up,fill:'none',stroke:'var(--c-BDG15)','stroke-width':1.6}));
    fig.appendChild(sv('path',{d:dn,fill:'none',stroke:'var(--c-BDG15)','stroke-width':1.6}));
    for(let i=0;i<=24;i++){ const x=-3+6*i/24; const rr=r(x); fig.appendChild(sv('ellipse',{cx:X(x),cy:Y0,rx:Math.max(rr*0.28,0.5),ry:Math.max(rr,0.5),fill:'none',stroke:'var(--c-BDG15)','stroke-width':0.9,opacity:.6})); }
    P.forEach((p,i)=>{ fig.appendChild(sv('circle',{cx:X(p),cy:Y0,r:4,fill:'var(--c-T22)'})); T(X(p)-18,Y0+52,'−m'+(i+1),{fill:'var(--c-T22)'}); });
    // holomorphic fibres at three base points
    T(500,16,'holomorphic picture: fibre of v⁺v⁻ = ∏(φ + m_i)');
    const bases=[P[0]-0.9, P[0], (N>1?(P[0]+P[1])/2:P[0]+0.9)];
    bases.forEach((phi,j)=>{
      const cx=520+j*82, cy=110, sc=13; const c0=P.reduce((a,p)=>a*(phi-p),1); const hit=P.findIndex(p=>Math.abs(phi-p)<1e-9); const c=Math.sign(c0)*Math.min(Math.max(Math.abs(c0),0.05),3);
      fig.appendChild(sv('rect',{x:cx-36,y:cy-58,width:72,height:116,rx:6,fill:'#fff',stroke:'#e4e2dc'}));
      fig.appendChild(sv('line',{x1:cx-34,y1:cy,x2:cx+34,y2:cy,stroke:'#d8d6d0'})); fig.appendChild(sv('line',{x1:cx,y1:cy-56,x2:cx,y2:cy+56,stroke:'#d8d6d0'}));
      if(hit>=0){ fig.appendChild(sv('line',{x1:cx-34,y1:cy,x2:cx+34,y2:cy,stroke:'var(--c-T22)','stroke-width':2.4})); fig.appendChild(sv('line',{x1:cx,y1:cy-56,x2:cx,y2:cy+56,stroke:'var(--c-T22)','stroke-width':2.4})); }
      else { [1,-1].forEach(sg=>{ let d='',pen=false; for(let i=0;i<=120;i++){ const x=sg*(0.02+2.6*i/120), y=c/x; if(Math.abs(y)>4.2){pen=false;continue;} d+=(pen?'L':'M')+(cx+x*sc).toFixed(1)+','+(cy-y*sc).toFixed(1); pen=true; } fig.appendChild(sv('path',{d,fill:'none',stroke:'var(--c-BDG15)','stroke-width':1.8})); }); }
      T(cx-34,cy+74,(hit>=0?'φ = −m'+(hit+1)+': node':'φ = '+phi.toFixed(2)),{'font-size':10.5});
      fig.appendChild(sv('line',{x1:X(phi),y1:Y0+8,x2:X(phi),y2:Y0+22,stroke:'#1d1d1f'}));
    });
    T(40,250,'U = 1/g² + Σ 1/|φ + mᵢ| (3-vectors; BDG15 (3.8)): larger 1/g² gives thinner circles far away; the pinch points do not move.');
  }
  [nS,mS,gS].forEach(e=>e.addEventListener('input',render)); render();
})();
(function modes(){
  const aS=$('mdA'), bS=$('mdB'); if(!aS) return;
  const fig=$('mdFig');
  const sup=n=>String(n).split('').map(ch=>({'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'})[ch]).join('');
  function render(){
    const a=+aS.value, b=+bS.value, c=a+b; fig.innerHTML='';
    const case3=a>0&&b<0, case4=a<0&&b>0; const d=(case3||case4)?Math.min(Math.abs(a),Math.abs(b)):0;
    const mis=[]; // [row, k]
    if(case3){ for(let j=1;j<=d;j++) mis.push([1,a-j]); }
    if(case4){ for(let j=1;j<=d;j++) mis.push([0,a+j-1]); }
    const isMis=(r,k)=>mis.some(m=>m[0]===r&&m[1]===k);
    const K0=-3, K1=5, x0=250, w=48, gap=6, h=34;
    for(let k=K0;k<=K1;k++){ const t=sv('text',{x:x0+(k-K0)*(w+gap)+w/2,y:20,'text-anchor':'middle','font-size':11.5,fill:'#6b6b70'}); t.textContent='z'+sup(k); fig.appendChild(t); }
    const rows=[['admitted at the intermediate step',' z^a C[[z]], a = '+a, k=>k>=a],['fibre of ℛ over a+b',' z^(a+b) C[[z]] ∩ C[[z]], a+b = '+c, k=>k>=Math.max(c,0)]];
    rows.forEach(([lab1,lab2,ok],r)=>{
      const y=32+r*(h+26);
      const t1=sv('text',{x:14,y:y+15,'font-size':12,fill:'#1d1d1f'}); t1.textContent=lab1; fig.appendChild(t1);
      const t2=sv('text',{x:14,y:y+30,'font-size':11,fill:'#6b6b70'}); t2.textContent=lab2; fig.appendChild(t2);
      for(let k=K0;k<=K1;k++){ const on=ok(k), pole=k<0, m=isMis(r,k);
        fig.appendChild(sv('rect',{x:x0+(k-K0)*(w+gap),y,width:w,height:h,rx:5,fill:on?(pole?'#b9d9c4':'var(--c-BFN16)'):'#fff',opacity:on?(pole?1:0.78):1,stroke:m?'#e07b00':'#cfcdc7','stroke-width':m?3.2:1})); }
    });
    const note=case3?'orange (row 2): allowed by the single monopole a+b, forbidden at the intermediate step — BFN case 3':
               case4?'orange (row 1): poles admitted at the intermediate step — the excess-intersection term, BFN case 4':
               'same signs (or a zero): the conditions simply add, no factor';
    const t=sv('text',{x:14,y:206,'font-size':12,fill:'#1d1d1f'}); t.textContent=note; fig.appendChild(t);
    const t3=sv('text',{x:14,y:224,'font-size':11,fill:'#6b6b70'}); t3.textContent='pale green = pole modes (k < 0); dark green = regular modes';  fig.appendChild(t3);
    const ks=mis.map(m=>m[1]).sort((u,v)=>u-v);
    const q=ks.map(k=>'(ξ '+(k+0.5>=0?'+ ':'− ')+Math.abs(k+0.5)+'ħ)').join('');
    $('mdTxt').textContent='r^λ · r^ν = '+(d?('ξ'+(d>1?sup(d):'')+' '):'')+'r^(λ+ν)   [d('+a+','+b+') = '+d+']'+(d?('   ·   quantised factor: '+q):'');
  }
  aS.addEventListener('input',render); bS.addEventListener('input',render); render();
})();
(function cone(){
  const mu=$('muS'), ta=$('tauS'); if(!mu) return;
  const B=$('baseG'), F=$('fibG'), W2=300, H2=250;
  function render(){
    const m=+mu.value, t=+ta.value, c=m*m-t*t;
    B.innerHTML=''; F.innerHTML='';
    const X=v=>(v+2)/4*W2, Y=v=>H2/2 - v*45;
    B.appendChild(sv('line',{x1:0,y1:Y(0),x2:W2,y2:Y(0),stroke:'#c9c2d6'}));
    let d='', pen=false; for(let i=0;i<=400;i++){ const v=-2+4*i/400, yy=Y(m*m-v*v); if(yy<8||yy>H2-8){ pen=false; continue; } d+=(pen?'L':'M')+X(v).toFixed(1)+','+yy.toFixed(1); pen=true; }
    B.appendChild(sv('path',{d,fill:'none',stroke:'var(--c-T18)','stroke-width':2}));
    [-m,m].forEach(r=>{ B.appendChild(sv('circle',{cx:X(r),cy:Y(0),r:4.5,fill:'#fff',stroke:'var(--c-GMP23)','stroke-width':2})); });
    B.appendChild(sv('line',{x1:X(t),y1:10,x2:X(t),y2:H2-10,stroke:'#1d1d1f','stroke-dasharray':'3 3'}));
    B.appendChild(sv('circle',{cx:X(t),cy:Y(c),r:4,fill:'#1d1d1f'}));
    const lab=sv('text',{x:X(t)+6,y:22,'font-size':11,fill:'#1d1d1f'}); lab.textContent='τ = '+t.toFixed(2); B.appendChild(lab);
    const l2=sv('text',{x:4,y:H2+22,'font-size':11,fill:'#6b6b70'}); l2.textContent='open circles: τ = −μ (zero of ε_V) and τ = +μ (pole of ε_V)'; B.appendChild(l2);
    const S=W2/2, cx=W2/2, cy=H2/2, sc=40, P=(x,y)=>[(cx+x*sc).toFixed(1),(cy-y*sc).toFixed(1)];
    F.appendChild(sv('line',{x1:0,y1:cy,x2:W2,y2:cy,stroke:'#c9c2d6'})); F.appendChild(sv('line',{x1:cx,y1:0,x2:cx,y2:H2,stroke:'#c9c2d6'}));
    const ax=sv('text',{x:W2-12,y:cy-6,'font-size':11,fill:'#6b6b70'}); ax.textContent='x'; F.appendChild(ax);
    const ay=sv('text',{x:cx+6,y:12,'font-size':11,fill:'#6b6b70'}); ay.textContent='y'; F.appendChild(ay);
    if(Math.abs(c)<0.02){
      F.appendChild(sv('line',{x1:0,y1:cy,x2:W2,y2:cy,stroke:'var(--c-GMP23)','stroke-width':3}));
      F.appendChild(sv('line',{x1:cx,y1:0,x2:cx,y2:H2,stroke:'var(--c-GMP23)','stroke-width':3}));
      $('fibreTxt').textContent='μ² − τ² = 0: the fibre degenerates to the two axes (a node).';
    } else {
      [1,-1].forEach(sg=>{ let d=''; let first=true; for(let i=0;i<=240;i++){ const x=sg*(0.03+3.7*i/240); const y=c/x; if(Math.abs(y)>3.2) { first=true; continue; } const [px,py]=P(x,y); d+=(first?'M':'L')+px+','+py; first=false; } F.appendChild(sv('path',{d,fill:'none',stroke:'var(--c-T18)','stroke-width':2.4})); });
      $('fibreTxt').textContent='μ² − τ² = '+c.toFixed(2)+': smooth fibre, a hyperbola ('+(c>0?'quadrants I and III':'quadrants II and IV')+').';
    }
  }
  mu.addEventListener('input',render); ta.addEventListener('input',render); render();
})();
