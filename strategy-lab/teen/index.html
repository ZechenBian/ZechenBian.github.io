<style>
/* 青少年版：一栏，手机优先，字大一点，系统字体，没有外部资源。 */
:root {
  --bg: #f6f3ec; --surface: #ffffff; --surface-2: #f0ebe0; --line: #e2dccd; --ink: #1d1a14; --ink2: #4e4737; --muted: #7f776a;
  --accent: #1f7a6b; --accent-ink: #145a4f; --accent-wash: rgba(31, 122, 107, 0.12); --on-accent: #ffffff;
  --warm: #d9742b; --good-ink: #1d6b1d; --good-wash: rgba(29, 107, 29, 0.10); --crit-ink: #b23a2a; --crit-wash: rgba(178, 58, 42, 0.10);
  --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 12px; --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 6px 20px rgba(60, 40, 0, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #15130f; --surface: #1f1c17; --surface-2: #27231c; --line: #3a342a; --ink: #f1ece2; --ink2: #c9c1b2; --muted: #978e7e;
    --accent: #3fb39f; --accent-ink: #8ad8c9; --accent-wash: rgba(63, 179, 159, 0.16); --on-accent: #0c1a17; --warm: #f0924a; --good-ink: #6fcf6f; --good-wash: rgba(111, 207, 111, 0.14); --crit-ink: #f08a7a; --crit-wash: rgba(240, 138, 122, 0.14);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35); }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--font); }
a { color: var(--accent-ink); }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance; }
h2 { font-size: 24px; margin: 8px 0 12px; }
h3 { font-size: 19px; margin: 0 0 8px; }
h4 { font-size: 15.5px; margin: 14px 0 6px; }
p { margin: 8px 0; }
ul { margin: 6px 0 10px; padding-left: 22px; }
li { margin: 4px 0; }
code { font: 0.92em var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
b { font-weight: 600; }
.note { color: var(--ink2); font-size: 14px; }
.lead { font-size: 17px; color: var(--ink2); }
.kicker { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-ink); font-weight: 600; margin-bottom: 4px; }
.tag { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-left: 6px; color: var(--muted); vertical-align: middle; white-space: nowrap; }

/* 顶栏 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
.brand { display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); }
.brand h1 { font-size: 20px; }
.brand small { color: var(--accent-ink); font-weight: 600; font-size: 14px; }
.nav { display: flex; gap: 4px; overflow-x: auto; margin: 6px -16px 0; padding: 0 16px 8px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { white-space: nowrap; text-decoration: none; color: var(--ink2); padding: 6px 12px; border-radius: 999px; font-size: 14.5px; }
.nav a.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.view { max-width: 820px; margin: 0 auto; padding: 16px 16px 40px; min-width: 0; }
.foot { max-width: 820px; margin: 0 auto; padding: 16px 16px 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

/* 卡片、按钮、排版 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; min-width: 0; }
.hero { padding: 8px 0 4px; }
.hero h2 { font-size: 26px; }
.today { border-color: var(--accent); box-shadow: var(--shadow); }
.steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 12px 0; }
.step { position: relative; margin: 0; padding-top: 18px; }
.stepn { position: absolute; top: -12px; left: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 700; display: grid; place-items: center; font-size: 14px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.three .card { margin: 0; padding: 10px 12px; }
.three h4 { margin-top: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 10px 0; }
.sp { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; min-height: 40px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.big { font-size: 18px; padding: 12px 22px; min-height: 48px; }
.btn.small { font-size: 14px; padding: 5px 10px; min-height: 34px; }
.btn:disabled, .btn.off { opacity: 0.45; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.chip { display: inline-flex; align-items: baseline; gap: 4px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14.5px; }
.chip.on { border-color: var(--accent); background: var(--accent-wash); }
.chip.done { border-color: var(--good-ink); }
.chip.done::after { content: " ✓"; color: var(--good-ink); }
.chip small { color: var(--muted); }
details.more { margin: 10px 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.more > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; }
details.more > summary::before { content: "▸ "; color: var(--accent-ink); }
details.more[open] > summary::before { content: "▾ "; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > .more-body { padding: 0 14px 12px; min-width: 0; }
pre.code { font: 13.5px/1.55 var(--mono); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; margin: 8px 0; }
.codeedit { width: 100%; min-height: 220px; font: 14px/1.55 var(--mono); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); resize: vertical; tab-size: 2; }
.codeedit.tall { min-height: 300px; }
.editor { margin: 10px 0; }
.editor label { font-weight: 600; }
.par { font: 14px var(--mono); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 220px; flex: 1; }
select { font: inherit; font-size: 14.5px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
pre.out { font: 14px/1.55 var(--mono); background: var(--surface-2); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 0 8px 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
.warn { background: var(--crit-wash); color: var(--crit-ink); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 14.5px; }
.ok { background: var(--good-wash); color: var(--good-ink); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 14.5px; }
p.ok { padding: 8px 12px; }
.hint { background: var(--accent-wash); border-radius: 8px; padding: 8px 12px; }
.task { border-color: var(--warm); }
.howto { background: var(--accent-wash); border-color: transparent; }
.howto h4 { margin-top: 0; }

/* 打一局 */
.game { margin-top: 6px; }
.gamehead { margin: 4px 0 8px; }
.board { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; box-shadow: var(--shadow); }
.status { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; font-size: 14px; color: var(--ink2); }
.status #round { font-weight: 600; color: var(--ink); }
.see { font-size: 22px; font-weight: 600; margin: 12px 0 6px; }
.last { color: var(--ink2); margin-bottom: 8px; font-size: 15px; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 4px; }
.btn.choice { font-size: 17px; padding: 12px 20px; min-height: 50px; min-width: 120px; flex: 1; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
input.num { font: 18px var(--mono); width: 120px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.result h3 { font-size: 20px; }
.refcard { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
.refcard:first-child { border-top: 0; margin-top: 0; }

/* 表格 */
.tabwrap { overflow-x: auto; margin: 8px 0; }
table.tab { border-collapse: collapse; width: 100%; font-size: 14.5px; }
table.tab caption { caption-side: bottom; text-align: left; color: var(--muted); font-size: 13px; padding: 6px 0; }
table.tab th, table.tab td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.tab th { font-weight: 600; color: var(--ink2); font-size: 13px; }
table.tab th.num, table.tab td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tab tr.me td { background: var(--accent-wash); }
table.tab .top { font-weight: 700; color: var(--accent-ink); }
.verdict.up { color: var(--good-ink); } .verdict.down { color: var(--crit-ink); } .verdict.flat { color: var(--muted); }
.demo h4:first-child { margin-top: 0; }
.exp h4:first-child { margin-top: 0; }
.teach h3 { color: var(--accent-ink); }

@media (max-width: 600px) {
  body { font-size: 15.5px; }
  .steps, .three { grid-template-columns: minmax(0, 1fr); }
  .hero h2 { font-size: 22px; }
  .see { font-size: 20px; }
  .btn.choice { min-width: 0; }
  table.tab { font-size: 13.5px; }
  table.tab th, table.tab td { padding: 6px 5px; }
}

/* ===== core.js ===== */
/* 策略实验室 · 计算内核
 * 同一份代码在页面主线程（只用到元数据）和后台线程（真正做计算）里各跑一遍：
 * 主线程用 QL_CORE.toString() 取得源码，拼上策略代码后做成 Worker。
 * 所以这个函数必须自包含，不能引用外面的任何变量。 */
function QL_CORE(self) {
"use strict";
var QL = { version: 3 };

/* ================================================================== *
 *  一、随机数
 * ================================================================== */
function hash32(x) {
  x |= 0;

  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
  return (x ^ (x >>> 16)) >>> 0;
}
QL.hash32 = hash32;

/* sfc32：每条路径一个独立的流，(种子, 路径号, 批次号) 决定一切，
 * 所以第 i 条路径长什么样与总路径数无关，也与生成顺序无关。 */
function RNG(seed, stream, batch) {
  this.a = hash32((seed | 0) ^ 0x9e3779b9);
  this.b = hash32(Math.imul((stream | 0) + 1, 0x7f4a7c15) ^ this.a);
  this.c = hash32(Math.imul((batch | 0) + 1, 0x165667b1) ^ this.b);

  for (var i = 0; i < 15; i++) this.next();

RNG.prototype.next = function () {
  var a = this.a, b = this.b, c = this.c;
  var t = (a + b | 0) + this.d | 0;
  this.d = this.d + 1 | 0;
  this.a = b ^ (b >>> 9);
  this.b = c + (c << 3) | 0;
  c = (c << 21) | (c >>> 11);
  this.c = c + t | 0;

/** (0,1) 上的均匀分布 */
RNG.prototype.u = function () { return (this.next() + 0.5) / 4294967296; };
RNG.prototype.uniform = function (lo, hi) {

  return lo + (hi - lo) * this.u();

/** 标准正态（Marsaglia 极坐标法） */
RNG.prototype.normal = function (mean, sd) {
  var z = this._sp;
  if (z === z) { this._sp = NaN; }
  else {
    var u, v, q;
    do { u = 2 * this.u() - 1; v = 2 * this.u() - 1; q = u * u + v * v; } while (q >= 1 || q === 0);

/** Gamma(k, 1)，Marsaglia–Tsang */
RNG.prototype.gamma = function (k) {

RNG.prototype.t = function (nu) { return this.normal() / Math.sqrt(2 * this.gamma(nu / 2) / nu); };

/** 计时：能用高精度时钟就用它 */

QL.nowMs = nowMs;
/** 一个对象里一共存了多少个数（规则的状态、训练出来的模型有多大）。
 *  模型库里的模型把数据藏在闭包里，数不到，所以由它们自己报：带 kind、size 并且能 predict（或 filter）的对象直接取 size。
 *  出任何意外（比如会抛错的属性）都返回 null，不让"量一下大小"拖垮一次回测。 */

    if (seen) seen.add(x);

 *  二、小工具

/* ---------- 分数布朗运动 ---------- */
var fgnCache = {};
function fgnEigen(H, M) {
  var key = H.toFixed(4) + ":" + M;
  if (fgnCache[key]) return fgnCache[key];
  var n = M / 2, re = new Float64Array(M), im = new Float64Array(M), h2 = 2 * H;
  function gam(k) { return 0.5 * (Math.pow(k + 1, h2) - 2 * Math.pow(k, h2) + Math.pow(Math.abs(k - 1), h2)); }
  for (var k = 0; k <= n; k++) { var v = gam(k); re[k] = v; if (k > 0 && k < n) re[M - k] = v; }
  fft(re, im);
  var out = new Float64Array(M);
  for (var j = 0; j < M; j++) out[j] = Math.sqrt(Math.max(0, re[j]) / M);
  fgnCache[key] = out;
  return out;
}
/** 生成 n 个单位方差的分数高斯噪声（Davies–Harte 循环嵌入法） */
function fgn(n, H, rng, out) {
  var M = 2 * nextPow2(n), half = M / 2, sq = fgnEigen(H, M), re = new Float64Array(M), im = new Float64Array(M);
  re[0] = sq[0] * rng.normal(); re[half] = sq[half] * rng.normal();
  for (var j = 1; j < half; j++) {
    var a = sq[j] * Math.SQRT1_2 * rng.normal(), b = sq[j] * Math.SQRT1_2 * rng.normal();
    re[j] = a; im[j] = b; re[M - j] = a; im[M - j] = -b;
  }
  fft(re, im);
  for (var t = 0; t < n; t++) out[t] = re[t];
  return out;
}
QL.fgn = fgn;
