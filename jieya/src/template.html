<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>深夜解压铺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* layout: one-screen toy shelf — brand + scrollable shelf of toys, a full-bleed play stage, a slim footer. Deliberately dark: a late-night lamp-lit room. */
:root{
  --bg:#12141c;
  --panel:#1a1e2a;
  --line:#2b3042;
  --ink:#ece6d6;
  --muted:#8e91a5;
  --accent:#f2b56b;
  --accent-ink:#2a1906;
  --display:"ZCOOL XiaoWei","Songti SC","Noto Serif SC",serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;box-sizing:border-box;
  background:var(--bg);color:var(--ink);font-family:var(--body);
  display:flex;flex-direction:column;gap:10px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
header{display:flex;align-items:center;gap:10px 18px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.brand h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.12em;white-space:nowrap}
#shelf{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 2px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent);
          mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent)}
#shelf::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:14px;padding:6px 13px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;white-space:nowrap}
.chip:first-child{margin-left:8px}
.chip:last-child{margin-right:20px}
.chip:hover{color:var(--ink);border-color:#3a4058}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stage{flex:1;min-height:0;position:relative;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.toy{position:absolute;inset:0;overflow:hidden}
.toy canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;letter-spacing:.08em;pointer-events:none;white-space:nowrap;z-index:20;opacity:.9;transition:opacity .8s;
  background:rgba(18,20,28,.55);padding:4px 12px;border-radius:999px}
.hint.gone{opacity:0}

footer{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
#stat{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
#stat b{color:var(--ink);font-weight:500}
.right{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:640px){
  header{flex-direction:column;align-items:stretch;gap:8px}
  .brand span{display:none}
  .chip:first-child{margin-left:0}
  #shelf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
}
.copy{flex-basis:100%;color:var(--muted);font-size:11px;letter-spacing:.04em;opacity:.7}
/*TOY_CSS*/
</style>
</head>
<body>
<header>
  <div class="brand"><h1>深夜解压铺</h1><span>凌晨也营业</span></div>
  <nav id="shelf" role="tablist" aria-label="选择玩具"></nav>
</header>

<main id="stage">
  <div class="hint" id="hint"></div>
</main>

<footer>
  <div id="stat"></div>
  <div class="right" id="acts">
    <button class="btn on" id="snd" aria-pressed="true">声音 开</button>
  </div>
  <div class="copy">© 2026 Zechen Bian · All rights reserved / 保留所有权利</div>
</footer>


<script>
__CORE__
</script>
<script>
__TOYS__
</script>
<script>J.start();</script>
</body>
</html>
