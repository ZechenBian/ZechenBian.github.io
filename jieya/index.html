/* ===== slime ===== */
/* 捏史莱姆 — a glossy soft-body slime.
   Physics: ring of perimeter particles, edge + bending springs, an area-pressure term that keeps the volume,
   and a weak, well-damped shape-matching pull toward the rest shape (the lazy rebound). Semi-implicit Euler, 5 substeps.
   Glitter, bubbles and dimples live in "fan" coordinates (segment i, t along it, s from the centre), so they ride the deformation. */
(() => {
const TAU = Math.PI * 2, N = 60, SUB = 5;
const LX = -0.6, LY = -0.8;                       // light comes from the upper left
const PAL = [
  { name: '薄荷', light: [200, 248, 228], base: [78, 194, 160], deep: [30, 116, 100], rim: [10, 56, 52], glow: [178, 255, 226] },
  { name: '葡萄', light: [222, 202, 255], base: [140, 100, 210], deep: [72, 44, 140], rim: [34, 18, 78], glow: [222, 196, 255] },
  { name: '桃子', light: [255, 226, 208], base: [247, 156, 130], deep: [192, 88, 80], rim: [104, 38, 44], glow: [255, 214, 184] },
  { name: '柠檬', light: [255, 248, 200], base: [240, 208, 96], deep: [178, 138, 36], rim: [98, 70, 14], glow: [255, 242, 176] },
  { name: '银河', light: [126, 98, 206], base: [50, 30, 98], deep: [22, 11, 52], rim: [8, 4, 22], glow: [150, 168, 255], galaxy: 1 }
];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const S = {
  n: +J.store.get('slime-n', 0),
  ci: Math.min(PAL.length - 1, Math.max(0, +J.store.get('slime-color', 0) || 0)),
  pi: 0, mix: 1,            // previous colour index + cross-fade progress
  time: 0, lastCreak: 0, lastPop: 0, energy: 0, energyPrev: 0
};
S.pi = S.ci;

let cv, ctx, W = 0, H = 0, k = 1, R = 100, hx = 0, hy = 0, inited = false;
let layer, lctx, bgc, bgx, spW, spK, spStar;
const px = new Float64Array(N), py = new Float64Array(N), vx = new Float64Array(N), vy = new Float64Array(N);
const ax = new Float64Array(N), ay = new Float64Array(N), qx = new Float64Array(N), qy = new Float64Array(N);
const L0 = new Float64Array(N), B0 = new Float64Array(N), LPx = new Float64Array(N), LPy = new Float64Array(N);
const thick = new Float64Array(N), opp = new Int16Array(N), nx = new Float64Array(N), ny = new Float64Array(N);
let A0 = 1, edge0 = 1;
const grabs = new Map();
const dimples = [];
const glitter = [], bubbles = [];
let cx = 0, cy = 0, hubX = 0, hubY = 0;

/* ---------- helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + clamp(a, 0, 1).toFixed(3) + ')';
function sprite(r, g, b, soft){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  const col = a => `rgba(${r},${g},${b},${a})`;
  if(soft){ gr.addColorStop(0, col(1)); gr.addColorStop(.35, col(.75)); gr.addColorStop(.7, col(.25)); gr.addColorStop(1, col(0)); }
  else { gr.addColorStop(0, col(1)); gr.addColorStop(.55, col(.9)); gr.addColorStop(.8, col(.35)); gr.addColorStop(1, col(0)); }
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return c;
}
function starSprite(){
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.18, 'rgba(255,250,235,.85)'); g.addColorStop(.45, 'rgba(255,240,220,.15)'); g.addColorStop(1, 'rgba(255,240,220,0)');
  x.fillStyle = g; x.fillRect(0, 0, 32, 32);
  x.fillStyle = 'rgba(255,255,255,.55)';
  x.fillRect(15, 3, 2, 26); x.fillRect(3, 15, 26, 2);
  return c;
}

/* rest shape: a slightly irregular, slightly squat blob */
function restShape(){
  for(let i = 0; i < N; i++){
    const a = i / N * TAU;
    const r = R * (1 + .035 * Math.sin(2 * a + .6) + .025 * Math.sin(3 * a + 1.9) + .012 * Math.sin(5 * a + .3));
    qx[i] = Math.cos(a) * r * 1.07; qy[i] = Math.sin(a) * r * .94;
  }
  let mx = 0, my = 0;
  for(let i = 0; i < N; i++){ mx += qx[i]; my += qy[i]; }
  mx /= N; my /= N;
  for(let i = 0; i < N; i++){ qx[i] -= mx; qy[i] -= my; }
  A0 = 0;
  for(let i = 0; i < N; i++){
    const j = (i + 1) % N, j2 = (i + 2) % N;
    A0 += qx[i] * qy[j] - qx[j] * qy[i];
    L0[i] = Math.hypot(qx[j] - qx[i], qy[j] - qy[i]);
    B0[i] = Math.hypot(qx[j2] - qx[i], qy[j2] - qy[i]);
  }
  A0 *= .5;
  for(let i = 0; i < N; i++){ const a = (i + N - 1) % N, b = (i + 1) % N; LPx[i] = (qx[a] + qx[b]) * .5 - qx[i]; LPy[i] = (qy[a] + qy[b]) * .5 - qy[i]; }
  edge0 = TAU * R / N;
}
function placeAtRest(squash){
  for(let i = 0; i < N; i++){
    px[i] = hx + qx[i] * (squash ? 1.1 : 1); py[i] = hy + qy[i] * (squash ? .86 : 1);
    vx[i] = 0; vy[i] = squash ? -qy[i] * .9 : 0;
  }
}
function seedDecor(){
  glitter.length = 0;
  for(let n = 0; n < 130; n++){
    glitter.push({ i: (Math.random() * N) | 0, t: Math.random(), s: Math.sqrt(Math.random()) * .93,
      z: .5 + Math.random() * 1.2, ph: Math.random() * TAU, sp: .6 + Math.random() * 1.6,
      c: Math.random() < .07 ? 1 : Math.random() < .45 ? 2 : 0 });
  }
  bubbles.length = 0;
  for(let n = 0; n < 6; n++) bubbles.push(newBubble(true));
}
function newBubble(now){
  return { i: (Math.random() * N) | 0, t: Math.random(), s: .25 + Math.random() * .6, r: .025 + Math.random() * .035,
    life: now ? 1 : 0, pop: -1, wait: 0, dr: (Math.random() - .5) * .4 };
}

/* fan coordinates: point = c + s * (lerp(p_i, p_i+1, t) - c) */
function fanPos(i, t, s, out){
  const j = (i + 1) % N;
  const ex = px[i] + (px[j] - px[i]) * t, ey = py[i] + (py[j] - py[i]) * t;
  out[0] = cx + (ex - cx) * s; out[1] = cy + (ey - cy) * s;
}
function toFan(x, y){
  for(let i = 0; i < N; i++){
    const j = (i + 1) % N;
    const ux = px[i] - cx, uy = py[i] - cy, wx = px[j] - cx, wy = py[j] - cy, X = x - cx, Y = y - cy;
    const det = ux * wy - uy * wx; if(Math.abs(det) < 1e-9) continue;
    const a = (X * wy - Y * wx) / det, b = (ux * Y - uy * X) / det;     // X = a u + b w
    if(a >= -1e-6 && b >= -1e-6){ const s = a + b; return { i, t: s > 1e-9 ? b / s : 0, s: Math.min(s, 1.05) }; }
  }
  let bi = 0, bd = Infinity;
  for(let i = 0; i < N; i++){ const d = (px[i] - x) ** 2 + (py[i] - y) ** 2; if(d < bd){ bd = d; bi = i; } }
  return { i: bi, t: 0, s: Math.min(1, Math.hypot(x - cx, y - cy) / Math.max(1, Math.hypot(px[bi] - cx, py[bi] - cy))) };
}
function inside(x, y){
  let c = false;
  for(let i = 0, j = N - 1; i < N; j = i++){
    if(((py[i] > y) !== (py[j] > y)) && (x < (px[j] - px[i]) * (y - py[i]) / (py[j] - py[i]) + px[i])) c = !c;
  }
  return c;
}
function edgeDist(x, y){
  let best = Infinity;
  for(let i = 0; i < N; i++){
    const j = (i + 1) % N, ex = px[j] - px[i], ey = py[j] - py[i];
    const l2 = ex * ex + ey * ey || 1;
    const t = clamp(((x - px[i]) * ex + (y - py[i]) * ey) / l2, 0, 1);
    const d = (px[i] + ex * t - x) ** 2 + (py[i] + ey * t - y) ** 2;
    if(d < best) best = d;
  }
  return Math.sqrt(best);
}

/* ---------- physics ---------- */
const P = { ks: 19, cd: 3.2, cf: 1.1, kh: 7, ch: 4.5, anchor: .8, kl: 140, keS: 60, keC: 300, kb: 60, kpF: 300, kg: 650, cg: 30 };
function step(h, sub){
  let mx = 0, my = 0, mvx = 0, mvy = 0;
  for(let i = 0; i < N; i++){ mx += px[i]; my += py[i]; mvx += vx[i]; mvy += vy[i]; }
  mx /= N; my /= N; mvx /= N; mvy /= N;
  let num = 0, den = 0, A = 0;
  for(let i = 0; i < N; i++){
    const dx = px[i] - mx, dy = py[i] - my;
    num += qx[i] * dy - qy[i] * dx; den += qx[i] * dx + qy[i] * dy;
    const j = i + 1 === N ? 0 : i + 1;
    A += px[i] * py[j] - px[j] * py[i];
  }
  A *= .5;
  const th = Math.atan2(num, den) * .6, co = Math.cos(th), si = Math.sin(th);
  const br = reduce ? 1 : 1 + .011 * Math.sin(S.time * 1.15) + .006 * Math.sin(S.time * 2.7 + 1);
  const brx = br, bry = reduce ? 1 : 2 - br;
  const hfx = P.kh * (hx - mx) - P.ch * mvx, hfy = P.kh * (hy - my) - P.ch * mvy;
  // shape-matching centre is partly anchored to home: the slime sits on the table, so a pinch stretches it into a neck
  const ox = mx + (hx - mx) * P.anchor, oy = my + (hy - my) * P.anchor;
  for(let i = 0; i < N; i++){
    const rqx = qx[i] * brx, rqy = qy[i] * bry;
    const gx = ox + co * rqx - si * rqy, gy = oy + si * rqx + co * rqy;
    ax[i] = P.ks * (gx - px[i]) - P.cd * (vx[i] - mvx) - P.cf * vx[i] + hfx;
    ay[i] = P.ks * (gy - py[i]) - P.cd * (vy[i] - mvy) - P.cf * vy[i] + hfy;
  }
  // curvature smoothing toward the rest-shape Laplacian: keeps the outline from crumpling under compression
  for(let i = 0; i < N; i++){
    const a = i === 0 ? N - 1 : i - 1, b = i + 1 === N ? 0 : i + 1;
    const lx = (px[a] + px[b]) * .5 - px[i] - (co * LPx[i] - si * LPy[i]), ly = (py[a] + py[b]) * .5 - py[i] - (si * LPx[i] + co * LPy[i]);
    const fx = P.kl * lx, fy = P.kl * ly;
    ax[i] += fx; ay[i] += fy; ax[a] -= fx * .5; ay[a] -= fy * .5; ax[b] -= fx * .5; ay[b] -= fy * .5;
  }
  // edge + bending springs
  for(let i = 0; i < N; i++){
    const j = i + 1 === N ? 0 : i + 1;
    let dx = px[j] - px[i], dy = py[j] - py[i], len = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    let ext = len - L0[i], f = (ext > 0 ? P.keS : P.keC) * ext / len;
    ax[i] += f * dx; ay[i] += f * dy; ax[j] -= f * dx; ay[j] -= f * dy;
    const j2 = j + 1 === N ? 0 : j + 1;
    dx = px[j2] - px[i]; dy = py[j2] - py[i]; len = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    ext = len - B0[i]; f = P.kb * (ext > 0 ? .35 : 1) * ext / len;
    ax[i] += f * dx; ay[i] += f * dy; ax[j2] -= f * dx; ay[j2] -= f * dy;
  }
  // pressure (area preservation): push along dA/dx_i
  const pr = P.kpF * R * (A0 - A) / A0 / edge0;
  for(let i = 0; i < N; i++){
    const a = i === 0 ? N - 1 : i - 1, b = i + 1 === N ? 0 : i + 1;
    ax[i] += pr * .5 * (py[b] - py[a]); ay[i] += pr * .5 * (px[a] - px[b]);
  }
  // grabs (pointer pinches)
  const u = (sub + 1) / SUB;
  for(const g of grabs.values()){
    const gx = g.fx + (g.x - g.fx) * u, gy = g.fy + (g.y - g.fy) * u;
    if(g.type === 'grab'){
      const kk = g.drag ? P.kg : P.kg * .25;
      for(let n = 0; n < g.ids.length; n++){
        const i = g.ids[n], w = g.w[n];
        ax[i] += w * (kk * (gx + g.ox[n] - px[i]) + P.cg * (g.vx - vx[i]));
        ay[i] += w * (kk * (gy + g.oy[n] - py[i]) + P.cg * (g.vy - vy[i]));
      }
    }
  }
  for(let i = 0; i < N; i++){
    vx[i] += ax[i] * h; vy[i] += ay[i] * h;
    px[i] += vx[i] * h; py[i] += vy[i] * h;
  }
  // pushers (pointer pressing from the outside): circular collider
  for(const g of grabs.values()){
    if(g.type !== 'push') continue;
    const gx = g.fx + (g.x - g.fx) * u, gy = g.fy + (g.y - g.fy) * u, r = g.r;
    let hit = false;
    for(let i = 0; i < N; i++){
      const dx = px[i] - gx, dy = py[i] - gy, d2 = dx * dx + dy * dy;
      if(d2 < r * r){
        const d = Math.sqrt(d2) || 1e-6, nX = dx / d, nY = dy / d;
        px[i] = gx + nX * r; py[i] = gy + nY * r;
        const vn = vx[i] * nX + vy[i] * nY, pn = g.vx * nX + g.vy * nY;
        if(vn < pn){ vx[i] += (pn - vn) * nX; vy[i] += (pn - vn) * nY; }
        hit = true;
      }
    }
    if(hit && !g.touched){ g.touched = true; g.contact = true; }
    if(!hit) g.touched = false;
  }
  // keep the two sides of a thin strand from passing through each other
  const dmin = .075 * R, dmin2 = dmin * dmin;
  for(let i = 0; i < N; i++){
    for(let j = i + 4; j < N; j++){
      if(j - i > N - 4) break;
      const dx = px[j] - px[i], dy = py[j] - py[i], d2 = dx * dx + dy * dy;
      if(d2 < dmin2){
        const d = Math.sqrt(d2) || 1e-6, o = (dmin - d) * .5 / d;
        px[i] -= dx * o; py[i] -= dy * o; px[j] += dx * o; py[j] += dy * o;
      }
    }
  }
  // stage walls
  const m = 6, top = 40;
  for(let i = 0; i < N; i++){
    if(px[i] < m){ px[i] = m; if(vx[i] < 0) vx[i] *= -.25; }
    else if(px[i] > W - m){ px[i] = W - m; if(vx[i] > 0) vx[i] *= -.25; }
    if(py[i] < top){ py[i] = top; if(vy[i] < 0) vy[i] *= -.25; }
    else if(py[i] > H - m){ py[i] = H - m; if(vy[i] > 0) vy[i] *= -.25; }
  }
}

/* ---------- sound ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
function squelch(v = 1){
  const p = rnd(.85, 1.15);
  J.sfx.noise({ type: 'lowpass', freq: 1700 * p, freq2: 240 * p, Q: 7, peak: .2 * v, dec: .2, att: .012 });
  J.sfx.tone({ f: 250 * p, f2: 92 * p, peak: .1 * v, dec: .17, att: .01 });
  J.sfx.noise({ type: 'bandpass', freq: 520 * p, freq2: 300 * p, Q: 3, peak: .06 * v, dec: .12, att: .02, delay: .03 });
}
function plop(v = 1){
  const p = rnd(.88, 1.14);
  J.sfx.tone({ f: 470 * p, f2: 150 * p, peak: .17 * Math.min(1.3, v), dec: .12, att: .004 });
  J.sfx.tone({ f: 760 * p, f2: 320 * p, peak: .05, dec: .07, delay: .045 });
  J.sfx.noise({ type: 'lowpass', freq: 1000 * p, freq2: 220, Q: 2, peak: .07 * v, dec: .08 });
}
function popSound(){
  const f = rnd(1300, 2300);
  J.sfx.tone({ f, f2: f * 1.7, peak: .045, dec: .035, att: .002, wet: .15, pan: rnd(-.4, .4) });
  J.sfx.noise({ type: 'highpass', freq: 3000, Q: .7, peak: .025, dec: .018 });
}
function creak(v){
  const f = rnd(380, 720);
  J.sfx.noise({ type: 'bandpass', freq: f, freq2: f * rnd(.75, 1.2), Q: 14, peak: .03 + .03 * v, dec: .055, att: .012 });
}

/* ---------- actions ---------- */
function count(){ S.n++; J.store.set('slime-n', S.n); J.stat(); }
function addDimple(x, y, r, depth, held){
  const f = toFan(x, y);
  const d = { i: f.i, t: f.t, s: f.s, r, d: held ? 0 : depth, target: depth, held, age: 0 };
  dimples.push(d);
  if(dimples.length > 10) dimples.shift();
  return d;
}
function poke(x, y, strength){
  addDimple(x, y, (.24 + .12 * strength) * R, Math.min(1.25, .85 * strength), false);
  for(let i = 0; i < N; i++){
    const dx = px[i] - x, dy = py[i] - y, f = Math.exp(-(dx * dx + dy * dy) / (.2 * R * R)) * strength;
    let ix = cx - px[i], iy = cy - py[i]; const il = Math.hypot(ix, iy) || 1; ix /= il; iy /= il;
    px[i] += ix * f * .1 * R; py[i] += iy * f * .1 * R;
    vx[i] += ix * f * 1.4 * R - ix * .35 * R * strength; vy[i] += iy * f * 1.4 * R - iy * .35 * R * strength;
  }
  const p = rnd(.88, 1.12);
  J.sfx.tone({ f: 330 * p * (strength > 1.2 ? .7 : 1), f2: 120 * p, peak: .16 + .04 * strength, dec: .15, att: .006 });
  J.sfx.noise({ type: 'lowpass', freq: 1300 * p, freq2: 260, Q: 5, peak: .12, dec: .11 });
  J.sfx.tone({ f: 620 * p, f2: 900 * p, peak: .035, dec: .06, delay: .07, wet: .2 });
  J.buzz(strength > 1.2 ? 18 : 9);
  if(Math.random() < .35) S.lastPop = -1;   // invite a bubble pop soon
}
function bigPoke(){ J.ac(); count(); poke(cx, cy, 1.8); }

/* ---------- pointer ---------- */
/* pick the particles a pinch at (sx, sy) holds, relative to the pointer at (x, y). Falloff is measured from the nearest
   particle, so a grab deep inside still catches the closest stretch of rim. */
function setGrab(g, sx, sy, x, y){
  let dmin = Infinity;
  for(let i = 0; i < N; i++) dmin = Math.min(dmin, Math.hypot(px[i] - sx, py[i] - sy));
  const span = .6 * R;
  g.ids = []; g.w = []; g.ox = []; g.oy = [];
  for(let i = 0; i < N; i++){
    const d = Math.hypot(px[i] - sx, py[i] - sy) - dmin;
    if(d < span){ const u = 1 - d / span; g.ids.push(i); g.w.push(u * u * u * (u * (u * 6 - 15) + 10)); g.ox.push(px[i] - x); g.oy.push(py[i] - y); }
  }
  g.deep = dmin > .45 * R;
}
function onDown(e){
  e.preventDefault(); J.ac();
  const [x, y] = J.local(e, cv);
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  const tol = Math.max(16, .1 * R);
  const g = { id: e.pointerId, x, y, fx: x, fy: y, x0: x, y0: y, vx: 0, vy: 0, t0: performance.now(), drag: false, lastX: x, lastY: y, lastT: performance.now() };
  if(inside(x, y) || edgeDist(x, y) < tol){
    g.type = 'grab';
    setGrab(g, x, y, x, y);
    g.dimple = inside(x, y) ? addDimple(x, y, .2 * R, .55, true) : null;
    count();
    squelch(.9);
    J.buzz(8);
  } else {
    g.type = 'push'; g.r = Math.max(15, .17 * R);
  }
  grabs.set(e.pointerId, g);
}
function onMove(e){
  const g = grabs.get(e.pointerId); if(!g) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  const last = evs && evs.length ? evs[evs.length - 1] : e;
  const [x, y] = J.local(last, cv);
  g.x = x; g.y = y;
  if(!g.drag && Math.hypot(x - g.x0, y - g.y0) > 8){
    g.drag = true;
    if(g.dimple){ g.dimple.held = false; g.dimple = null; }
    // pinched deep inside: grab the rim on the side we are pulling toward, so it stretches out that way
    if(g.type === 'grab' && g.deep){
      const dx = x - g.x0, dy = y - g.y0, dl = Math.hypot(dx, dy) || 1;
      const t = rayDist(g.x0, g.y0, dx / dl, dy / dl) * .8;
      setGrab(g, g.x0 + dx / dl * t, g.y0 + dy / dl * t, x, y);
    }
  }
}
function onUp(e){
  const g = grabs.get(e.pointerId); if(!g) return;
  grabs.delete(e.pointerId);
  const dur = performance.now() - g.t0;
  if(g.type === 'grab'){
    if(!g.drag && dur < 260){
      if(g.dimple){ g.dimple.held = false; g.dimple.target = 0; }
      poke(g.x, g.y, 1);
    } else {
      if(g.dimple){ g.dimple.held = false; }
      plop(.6 + Math.min(1, S.energy * 6));
      J.buzz(6);
    }
  } else if(g.contact){
    plop(.45);
  }
}

/* ---------- rendering ---------- */
function makeBg(){
  bgc = document.createElement('canvas');
  bgc.width = Math.max(1, Math.round(W * k)); bgc.height = Math.max(1, Math.round(H * k));
  bgx = bgc.getContext('2d'); bgx.setTransform(k, 0, 0, k, 0, 0);
  bgx.fillStyle = J.C.panel; bgx.fillRect(0, 0, W, H);
  let g = bgx.createRadialGradient(hx - R * .4, hy - R * .8, 0, hx, hy, Math.max(W, H) * .75);
  g.addColorStop(0, 'rgba(242,181,107,.10)'); g.addColorStop(.35, 'rgba(242,181,107,.04)'); g.addColorStop(1, 'rgba(242,181,107,0)');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);
  // a soft pool of lamp light on the table under the slime
  bgx.save(); bgx.translate(hx, hy + R * .25); bgx.scale(1, .62);
  g = bgx.createRadialGradient(0, 0, 0, 0, 0, R * 2.3);
  g.addColorStop(0, 'rgba(255,226,180,.07)'); g.addColorStop(.6, 'rgba(255,226,180,.03)'); g.addColorStop(1, 'rgba(255,226,180,0)');
  bgx.fillStyle = g; bgx.beginPath(); bgx.arc(0, 0, R * 2.3, 0, TAU); bgx.fill(); bgx.restore();
  g = bgx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .8);
  g.addColorStop(0, 'rgba(8,9,14,0)'); g.addColorStop(1, 'rgba(8,9,14,.45)');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);
}
function trace(c, dx = 0, dy = 0, keep){
  if(!keep) c.beginPath();
  for(let i = 0; i < N; i++){
    const a = i === 0 ? N - 1 : i - 1, b = (i + 1) % N, b2 = (i + 2) % N;
    if(i === 0) c.moveTo(px[i] + dx, py[i] + dy);
    c.bezierCurveTo(px[i] + (px[b] - px[a]) / 6 + dx, py[i] + (py[b] - py[a]) / 6 + dy,
      px[b] - (px[b2] - px[i]) / 6 + dx, py[b] - (py[b2] - py[i]) / 6 + dy, px[b] + dx, py[b] + dy);
  }
  c.closePath();
}
function rayDist(ox, oy, dx, dy){
  let best = Infinity;
  for(let i = 0; i < N; i++){
    const j = (i + 1) % N, ex = px[j] - px[i], ey = py[j] - py[i];
    const den = dx * ey - dy * ex; if(Math.abs(den) < 1e-9) continue;
    const wx = px[i] - ox, wy = py[i] - oy;
    const t = (wx * ey - wy * ex) / den, u = (wx * dy - wy * dx) / den;
    if(t > 0 && u >= 0 && u <= 1 && t < best) best = t;
  }
  return best === Infinity ? R : best;
}
const tmp = [0, 0];
function measure(){
  cx = 0; cy = 0;
  for(let i = 0; i < N; i++){ cx += px[i]; cy += py[i]; }
  cx /= N; cy /= N;
  const skip = (N / 6) | 0;
  for(let i = 0; i < N; i++){
    let best = Infinity, bj = i;
    for(let j = 0; j < N; j++){
      let d = Math.abs(i - j); d = Math.min(d, N - d);
      if(d <= skip) continue;
      const d2 = (px[j] - px[i]) ** 2 + (py[j] - py[i]) ** 2;
      if(d2 < best){ best = d2; bj = j; }
    }
    thick[i] = Math.sqrt(best); opp[i] = bj;
    const a = i === 0 ? N - 1 : i - 1, b = (i + 1) % N;
    let gx = py[b] - py[a], gy = px[a] - px[b]; const gl = Math.hypot(gx, gy) || 1;
    nx[i] = gx / gl; ny[i] = gy / gl;
  }
  // hub: centre biased toward the thick part of the body (so highlights stay on the bulk, not on a strand)
  let sw = 0; hubX = 0; hubY = 0;
  for(let i = 0; i < N; i++){ const w = thick[i] * thick[i] * thick[i]; sw += w; hubX += px[i] * w; hubY += py[i] * w; }
  hubX /= sw; hubY /= sw;
  // pull toward the midpoint of the thickest chord (≈ centre of the largest inscribed circle), smoothed over time
  let ti = 0; for(let i = 1; i < N; i++) if(thick[i] > thick[ti]) ti = i;
  const tx = lerp(hubX, (px[ti] + px[opp[ti]]) * .5, .6), ty = lerp(hubY, (py[ti] + py[opp[ti]]) * .5, .6);
  if(!S.hubInit){ S.hubInit = 1; S.hx = tx; S.hy = ty; }
  S.hx += (tx - S.hx) * .2; S.hy += (ty - S.hy) * .2;
  hubX = S.hx; hubY = S.hy;
  // deformation energy (for creaks and bubble pops)
  let e = 0, mxx = 0;
  for(let i = 0; i < N; i++){
    const j = (i + 1) % N, l = Math.hypot(px[j] - px[i], py[j] - py[i]);
    e += (l / L0[i] - 1) ** 2; mxx += l;
  }
  S.energy = e / N;
}

function render(){
  const c = ctx, l = lctx;
  const A = PAL[S.pi], B = PAL[S.ci], mt = S.mix;
  const light = mixc(A.light, B.light, mt), base = mixc(A.base, B.base, mt), deep = mixc(A.deep, B.deep, mt),
    rim = mixc(A.rim, B.rim, mt), glow = mixc(A.glow, B.glow, mt);
  const gal = (A.galaxy ? 1 - mt : 0) + (B.galaxy ? mt : 0);

  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(bgc, 0, 0);
  c.setTransform(k, 0, 0, k, 0, 0);

  // contact shadow: a wide soft one and a tight dark one, cast by the outline itself
  c.save();
  c.translate(-6000, 0);
  trace(c);
  c.fillStyle = '#000';
  c.shadowColor = 'rgba(4,5,10,.5)'; c.shadowBlur = R * .32 * k;
  c.shadowOffsetX = (6000 + R * .06) * k; c.shadowOffsetY = R * .16 * k;
  c.fill();
  c.shadowColor = 'rgba(2,3,6,.55)'; c.shadowBlur = R * .07 * k;
  c.shadowOffsetX = (6000 + R * .02) * k; c.shadowOffsetY = R * .05 * k;
  c.fill();
  c.restore();

  // ---- body on its own layer ----
  l.setTransform(1, 0, 0, 1, 0, 0);
  l.clearRect(0, 0, layer.width, layer.height);
  l.setTransform(k, 0, 0, k, 0, 0);

  const rL = rayDist(hubX, hubY, LX, LY), rD = rayDist(hubX, hubY, -LX, -LY);
  const rr = Math.max(R * .3, (rL + rD) * .5);
  // base: a gentle top-left → bottom-right gradient over the whole body (strands keep their colour)
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for(let i = 0; i < N; i++){ if(px[i] < x0) x0 = px[i]; if(px[i] > x1) x1 = px[i]; if(py[i] < y0) y0 = py[i]; if(py[i] > y1) y1 = py[i]; }
  const lg = l.createLinearGradient(hubX + LX * rr, hubY + LY * rr, hubX - LX * rr, hubY - LY * rr);
  lg.addColorStop(0, rgba(mixc(base, light, .12), 1)); lg.addColorStop(.5, rgba(base, 1)); lg.addColorStop(1, rgba(mixc(base, deep, .8), 1));
  trace(l); l.fillStyle = lg; l.fill();

  l.save();
  trace(l); l.clip();
  // lit dome over the bulk of the body
  const gcx = hubX + LX * rL * .4, gcy = hubY + LY * rL * .4;
  const g = l.createRadialGradient(gcx, gcy, 0, gcx, gcy, rr * .95);
  const dome = 1 - .4 * gal;
  g.addColorStop(0, rgba(light, .9 * dome)); g.addColorStop(.4, rgba(light, .26 * dome)); g.addColorStop(1, rgba(light, 0));
  l.fillStyle = g; l.fillRect(gcx - rr * 1.1, gcy - rr * 1.1, rr * 2.2, rr * 2.2);
  // galaxy nebula + glitter, riding the mesh
  if(gal > .01){
    l.globalCompositeOperation = 'lighter';
    fanPos(7, .5, .55, tmp);
    let ng = l.createRadialGradient(tmp[0], tmp[1], 0, tmp[0], tmp[1], rr * .75);
    ng.addColorStop(0, 'rgba(190,70,160,' + (.22 * gal).toFixed(3) + ')'); ng.addColorStop(1, 'rgba(190,70,160,0)');
    l.fillStyle = ng; l.fillRect(tmp[0] - rr, tmp[1] - rr, rr * 2, rr * 2);
    fanPos(38, .5, .6, tmp);
    ng = l.createRadialGradient(tmp[0], tmp[1], 0, tmp[0], tmp[1], rr * .8);
    ng.addColorStop(0, 'rgba(60,150,190,' + (.2 * gal).toFixed(3) + ')'); ng.addColorStop(1, 'rgba(60,150,190,0)');
    l.fillStyle = ng; l.fillRect(tmp[0] - rr, tmp[1] - rr, rr * 2, rr * 2);
    const tw = reduce ? .3 : 1;
    for(const s of glitter){
      fanPos(s.i, s.t, s.s, tmp);
      const a = gal * (.35 + .65 * (.5 + .5 * Math.sin(S.time * s.sp * 2.2 * tw + s.ph)) ** 3);
      const sz = s.z * Math.max(1.3, R * .014) * (s.c === 1 ? 2.4 : 1);
      l.globalAlpha = a;
      if(s.c === 1) l.drawImage(spStar, tmp[0] - sz * 2, tmp[1] - sz * 2, sz * 4, sz * 4);
      else { l.fillStyle = s.c === 2 ? '#ffe6b8' : '#f4f0ff'; l.beginPath(); l.arc(tmp[0], tmp[1], sz * .5, 0, TAU); l.fill(); }
    }
    l.globalAlpha = 1;
    l.globalCompositeOperation = 'source-over';
  }

  // inner edge shading follows the deformed outline (so stretched strands read as rounded tubes)
  l.beginPath(); l.rect(-W, -H, W * 3, H * 3);
  trace(l, 0, 0, true);
  l.fillStyle = '#000';
  l.shadowColor = rgba(deep, .9); l.shadowBlur = R * .26 * k;
  l.shadowOffsetX = -LX * R * .05 * k; l.shadowOffsetY = -LY * R * .05 * k;
  l.fill('evenodd');
  l.shadowColor = rgba(rim, .8); l.shadowBlur = R * .07 * k;
  l.shadowOffsetX = -LX * R * .02 * k; l.shadowOffsetY = -LY * R * .02 * k;
  l.fill('evenodd');
  l.shadowColor = 'rgba(0,0,0,0)'; l.shadowBlur = 0; l.shadowOffsetX = l.shadowOffsetY = 0;

  // caustic glow: light that went through the body, gathered near the lower right
  l.globalCompositeOperation = 'screen';
  const qx2 = hubX - LX * rD * .5, qy2 = hubY - LY * rD * .5;
  const cg = l.createRadialGradient(qx2, qy2, 0, qx2, qy2, rr * .62);
  cg.addColorStop(0, rgba(glow, gal > .5 ? .22 : .38)); cg.addColorStop(1, rgba(glow, 0));
  l.fillStyle = cg; l.fillRect(qx2 - rr, qy2 - rr, rr * 2, rr * 2);
  l.globalCompositeOperation = 'source-over';

  // bubbles suspended inside
  for(const b of bubbles){
    if(b.life <= 0 && b.pop < 0) continue;
    fanPos(b.i, b.t, b.s, tmp);
    const br = b.r * R;
    if(b.pop >= 0){
      const u = b.pop;
      l.strokeStyle = rgba(light, .5 * (1 - u)); l.lineWidth = Math.max(.8, br * .25 * (1 - u));
      l.beginPath(); l.arc(tmp[0], tmp[1], br * (1 + u * 1.6), 0, TAU); l.stroke();
      continue;
    }
    const a = b.life;
    l.fillStyle = rgba(deep, .25 * a); l.beginPath(); l.arc(tmp[0], tmp[1], br, 0, TAU); l.fill();
    l.strokeStyle = rgba(light, .45 * a); l.lineWidth = Math.max(.7, br * .16);
    l.beginPath(); l.arc(tmp[0], tmp[1], br * .9, Math.PI * .1, Math.PI * 1.1); l.stroke();
    l.fillStyle = 'rgba(255,255,255,' + (.75 * a).toFixed(3) + ')';
    l.beginPath(); l.arc(tmp[0] + LX * br * .4, tmp[1] + LY * br * .4, br * .22, 0, TAU); l.fill();
  }

  // dimples: a concave dent — the wall nearer the light is in shade, the far wall catches light
  for(const d of dimples){
    if(Math.abs(d.d) < .01) continue;
    fanPos(d.i, d.t, d.s, tmp);
    const r = d.r * (1 + .25 * Math.max(0, -d.d)), dd = clamp(d.d, -1.3, 1.3), sg = dd > 0 ? 1 : -1, m = Math.abs(dd);
    const sx = tmp[0] + LX * r * .2 * sg, sy = tmp[1] + LY * r * .2 * sg;
    let gg = l.createRadialGradient(sx, sy, 0, sx, sy, r);
    gg.addColorStop(0, rgba(rim, .5 * m)); gg.addColorStop(.5, rgba(deep, .28 * m)); gg.addColorStop(1, rgba(deep, 0));
    l.fillStyle = gg; l.fillRect(sx - r, sy - r, r * 2, r * 2);
    const wx = tmp[0] - LX * r * .42 * sg, wy = tmp[1] - LY * r * .42 * sg, r2 = r * .5;
    gg = l.createRadialGradient(wx, wy, 0, wx, wy, r2);
    gg.addColorStop(0, rgba(light, .7 * m)); gg.addColorStop(1, rgba(light, 0));
    l.fillStyle = gg; l.fillRect(wx - r2, wy - r2, r2 * 2, r2 * 2);
  }

  // wet rim light: the outline inset a little, stroked with a gradient that is bright only on the side facing the lamp
  const ins = R * .075, wid = Math.max(1.2, R * .032);
  l.beginPath();
  for(let i = 0; i <= N; i++){ const m = i % N, x = px[m] - nx[m] * ins, y = py[m] - ny[m] * ins; i ? l.lineTo(x, y) : l.moveTo(x, y); }
  const ext = Math.max(x1 - x0, y1 - y0) * .5 + R * .2, mcx = (x0 + x1) / 2, mcy = (y0 + y1) / 2;
  let rg = l.createLinearGradient(mcx + LX * ext, mcy + LY * ext, mcx - LX * ext, mcy - LY * ext);
  rg.addColorStop(0, 'rgba(255,255,255,.5)'); rg.addColorStop(.3, 'rgba(255,255,255,.12)'); rg.addColorStop(.5, 'rgba(255,255,255,0)');
  rg.addColorStop(.78, rgba(light, 0)); rg.addColorStop(1, rgba(light, .3));
  l.strokeStyle = rg; l.lineWidth = wid; l.lineJoin = 'round'; l.stroke();

  // specular highlights, placed by the body's own extent toward the light
  const hx1 = hubX + LX * rL * .5, hy1 = hubY + LY * rL * .5, ang = Math.atan2(LY, LX) + Math.PI / 2;
  l.save(); l.translate(hx1, hy1); l.rotate(ang); l.scale(1, .55);
  l.globalAlpha = .26; l.drawImage(spW, -rL * .48, -rL * .48, rL * .96, rL * .96);
  l.restore();
  const hx2 = hubX + LX * rL * .64, hy2 = hubY + LY * rL * .64;
  l.save(); l.translate(hx2, hy2); l.rotate(ang - .12);
  l.fillStyle = 'rgba(255,255,255,.82)';
  l.beginPath(); l.ellipse(0, 0, rL * .17, rL * .062, 0, 0, TAU); l.fill();
  l.restore();
  const c3 = Math.cos(.55), s3 = Math.sin(.55);
  const dx3 = LX * c3 - LY * s3, dy3 = LX * s3 + LY * c3, r3 = rayDist(hubX, hubY, dx3, dy3);
  l.fillStyle = 'rgba(255,255,255,.75)';
  l.beginPath(); l.arc(hubX + dx3 * r3 * .74, hubY + dy3 * r3 * .74, Math.max(1.2, r3 * .035), 0, TAU); l.fill();
  l.restore(); // clip

  l.globalAlpha = 1;
  trace(l); l.strokeStyle = rgba(rim, .6); l.lineWidth = Math.max(1, R * .012); l.stroke();

  // thin strands: let a little light through
  l.globalCompositeOperation = 'destination-out';
  const tThin = .8 * R;
  for(let i = 0; i < N; i += 2){
    const t = thick[i]; if(t >= tThin) continue;
    const j = opp[i], mx = (px[i] + px[j]) * .5, my = (py[i] + py[j]) * .5, r = t * .7 + 2;
    l.globalAlpha = Math.min(.42, .5 * (1 - t / tThin));
    l.drawImage(spW, mx - r, my - r, r * 2, r * 2);
  }
  l.globalAlpha = 1;
  l.globalCompositeOperation = 'source-over';

  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(layer, 0, 0);
  c.setTransform(k, 0, 0, k, 0, 0);

  // fingertip rings for pointers pressing from outside
  for(const g of grabs.values()){
    if(g.type !== 'push') continue;
    c.strokeStyle = 'rgba(236,230,214,.18)'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(g.x, g.y, g.r, 0, TAU); c.stroke();
  }
}

/* ---------- per-frame ---------- */
function tick(now, dt){
  if(!inited) return;
  const sdt = Math.min(dt, 34) / 1000;
  S.time += sdt;
  if(S.mix < 1) S.mix = Math.min(1, S.mix + sdt / .45);
  // pointer velocities + creaks
  for(const g of grabs.values()){
    const gdt = Math.max(1e-3, sdt);
    const nvx = (g.x - g.fx) / gdt, nvy = (g.y - g.fy) / gdt;
    g.vx = lerp(g.vx, nvx, .5); g.vy = lerp(g.vy, nvy, .5);
  }
  const h = sdt / SUB;
  for(let s = 0; s < SUB; s++) step(h, s);
  for(const g of grabs.values()){
    g.fx = g.x; g.fy = g.y;
    if(g.contact){ g.contact = false; squelch(.5); J.buzz(5); count(); }
  }
  measure();

  // creak while stretching fast
  const de = S.energy - S.energyPrev; S.energyPrev = S.energy;
  let pulling = false;
  for(const g of grabs.values()) if(g.drag && Math.hypot(g.vx, g.vy) > 350) pulling = true;
  if(pulling && de > 0 && S.energy > .01 && now - S.lastCreak > 70 + Math.random() * 90){
    S.lastCreak = now; creak(Math.min(1, S.energy * 4));
  }

  // dimples fill back slowly, with a little overshoot
  for(let n = dimples.length - 1; n >= 0; n--){
    const d = dimples[n];
    if(d.held){ d.d += (d.target - d.d) * Math.min(1, sdt * 6); d.age = 0; d.d0 = d.d; continue; }
    if(d.d0 === undefined){ d.d0 = d.d || d.target; }
    d.age += sdt;
    const t = d.age;
    d.d = d.d0 * Math.exp(-t * 1.5) * Math.cos(t * 1.75);
    if(t > 4) dimples.splice(n, 1);
  }

  // bubbles: drift slowly, pop now and then (more when squeezed)
  const rate = .02 + Math.min(2.5, S.energy * 30) + (S.lastPop < 0 ? 1.5 : 0);
  for(const b of bubbles){
    if(b.pop >= 0){ b.pop += sdt / .16; if(b.pop >= 1){ b.pop = -1; b.life = 0; b.wait = 1 + Math.random() * 4; } continue; }
    if(b.life < 1 && b.wait <= 0){ b.life = Math.min(1, b.life + sdt / 1.2); }
    if(b.wait > 0){ b.wait -= sdt; if(b.wait <= 0){ Object.assign(b, newBubble(false)); } continue; }
    if(!reduce){ b.t += b.dr * sdt * .15; if(b.t > 1){ b.t -= 1; b.i = (b.i + 1) % N; } else if(b.t < 0){ b.t += 1; b.i = (b.i + N - 1) % N; } }
    if(b.life >= 1 && Math.random() < rate * sdt / bubbles.length && now - S.lastPop > 250){
      b.pop = 0; S.lastPop = now; popSound();
    }
  }
  if(S.lastPop < 0 && Math.random() < sdt) S.lastPop = 0;

  render();
}

J.register({
  id: 'slime', name: '捏史莱姆', hint: '按、拉、戳，松手它会慢慢弹回来',
  create(root){
    const o = J.canvas(root, { dprMax: 2 });
    cv = o.cv; ctx = o.ctx;
    this._o = o;
    layer = document.createElement('canvas'); lctx = layer.getContext('2d');
    spW = sprite(255, 255, 255, true); spK = sprite(0, 0, 0, true); spStar = starSprite();
    cv.style.cursor = 'grab';
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    cv.addEventListener('lostpointercapture', onUp);
  },
  resize(w, h){
    const o = this._o; o.fit(w, h);
    const oldR = R, ohx = hx, ohy = hy;
    W = w; H = h; k = o.k;
    R = Math.max(40, Math.min(W * .3, (H - 40) * .3, 185));
    hx = W / 2; hy = 40 + (H - 40) * .52;
    layer.width = cv.width; layer.height = cv.height;
    restShape();
    if(!inited){ placeAtRest(true); seedDecor(); inited = true; measure(); }
    else {
      const f = R / oldR;
      for(let i = 0; i < N; i++){ px[i] = hx + (px[i] - ohx) * f; py[i] = hy + (py[i] - ohy) * f; vx[i] *= f; vy[i] *= f; }
      measure();
    }
    makeBg();
    render();
  },
  enter(){ S.energyPrev = S.energy; },
  leave(){ grabs.clear(); for(const d of dimples) d.held = false; },
  tick,
  key(e){ if(e.code === 'Space'){ bigPoke(); return true; } },
  actions: [
    { label: '换颜色', run(){
      S.pi = S.ci; S.ci = (S.ci + 1) % PAL.length; S.mix = 0; J.store.set('slime-color', S.ci);
      const p = rnd(.9, 1.1);
      J.sfx.tone({ f: 520 * p, f2: 780 * p, peak: .08, dec: .18, wet: .3 });
      J.sfx.tone({ f: 780 * p, f2: 1040 * p, peak: .04, dec: .2, delay: .06, wet: .3 });
      // a soft wobble so the change feels physical
      for(let i = 0; i < N; i++){ vx[i] += (px[i] - cx) * .9; vy[i] += (py[i] - cy) * .9; }
      J.buzz(6);
    } }
  ],
  stat: () => `捏了 <b>${J.fmt(S.n)}</b> 下 · ${PAL[S.ci].name}`
});
})();

/* ===== lantern ===== */
/* 点灯笼 — release sky lanterns over a still lake; each one becomes a star, every seven stars a constellation. */
(() => {
const TAU = Math.PI * 2;

const HZ = 0.64;            // horizon (fraction of H)
const CAP = 294;            // star cap (multiple of 7)
const NAMES = ['夜猫座', '好梦座', '不加班座', '热可可座', '月亮邮差座', '小被子座', '晚风座', '软枕头座', '慢慢来座',
  '煮茶座', '早睡座', '小台灯座', '睡懒觉座', '打呵欠座', '软拖鞋座', '晚安座', '旧毛毯座', '猫打盹座', '没心事座',
  '星期六座', '雨后座', '桂花座', '一碗面座', '发呆座', '小确幸座', '远方来信座', '萤火座', '半个月亮座', '温牛奶座',
  '小板凳座', '明天再说座', '围巾座', '烤红薯座', '晒被子座', '小声说座', '摇椅座'];

/* ---------- persisted state ---------- */
let stars = J.store.getJSON('lantern-stars', []);      // [xn, yn, size, seed]
let cons = J.store.getJSON('lantern-cons', []);        // names, one per full group of 7
let released = +J.store.get('lantern-count', 0) || 0;
if(!Array.isArray(stars)) stars = [];
if(!Array.isArray(cons)) cons = [];
stars = stars.filter(s => Array.isArray(s) && s.length >= 4 && isFinite(s[0]) && isFinite(s[1]));
while(cons.length < Math.floor(stars.length / 7)) cons.push(NAMES[cons.length % NAMES.length]);
cons.length = Math.floor(stars.length / 7);
const saveStars = () => { J.store.setJSON('lantern-stars', stars); J.store.setJSON('lantern-cons', cons); };

/* ---------- runtime ---------- */
let view, cv, ctx, W = 0, H = 0, hz = 0, k = 1;
let bg, bgR;                       // sky+mountains, pre-flipped reflection
let clock = 0;
const lanterns = [];
const queue = [];                  // staggered releases {at, xn}
const shoots = [];
const born = [];                   // star birth time (runtime only), parallel to stars

let twinkleBg = [];                // a few background stars that twinkle
let shimmer = [];

/* ---------- sprites ---------- */
function mk(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

  const g = x.createRadialGradient(r, r, 0, r, r, r);

}
function buildSprites(){

  const w = 120, h = 160;
  const [c, x] = mk(w, h);

    x.beginPath();

  };

  const g = x.createRadialGradient(w * 0.5, h * 0.86, 2, w * 0.5, h * 0.6, h * 0.72);
  g.addColorStop(0, '#fff6d6'); g.addColorStop(0.2, '#ffd07a'); g.addColorStop(0.48, '#f39a45');
  g.addColorStop(0.78, '#c95a2e'); g.addColorStop(1, '#8a3222');

  x.save(); P(); x.clip();
  // paper ribs
  x.strokeStyle = 'rgba(130,48,24,.28)'; x.lineWidth = 2;
  for(const f of [0.3, 0.5, 0.7]){
    x.beginPath(); x.moveTo(w * (0.5 + (f - 0.5) * 1.75), h * 0.06); x.lineTo(w * (0.5 + (f - 0.5) * 1.25), h * 0.92); x.stroke();
  }
  // horizontal seam + top sheen
  x.strokeStyle = 'rgba(130,48,24,.18)'; x.lineWidth = 1.5;
  x.beginPath(); x.moveTo(0, h * 0.24); x.quadraticCurveTo(w * 0.5, h * 0.28, w, h * 0.24); x.stroke();
  const sh = x.createLinearGradient(0, 0, w, 0);
  sh.addColorStop(0, 'rgba(90,25,15,.45)'); sh.addColorStop(0.22, 'rgba(90,25,15,0)');
  sh.addColorStop(0.78, 'rgba(90,25,15,0)'); sh.addColorStop(1, 'rgba(90,25,15,.45)');
  x.fillStyle = sh; x.fillRect(0, 0, w, h);
  const top = x.createLinearGradient(0, 0, 0, h * 0.3);
  top.addColorStop(0, 'rgba(90,30,18,.35)'); top.addColorStop(1, 'rgba(90,30,18,0)');
  x.fillStyle = top; x.fillRect(0, 0, w, h * 0.3);
  x.restore();
  // rim
  x.strokeStyle = 'rgba(70,26,14,.9)'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(w * 0.21, h * 0.905); x.quadraticCurveTo(w * 0.5, h * 0.955, w * 0.79, h * 0.905); x.stroke();
  // wire to the fuel cake
  x.strokeStyle = 'rgba(70,26,14,.5)'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(w * 0.24, h * 0.91); x.lineTo(w * 0.5, h * 0.97); x.lineTo(w * 0.76, h * 0.91); x.stroke();
  SPR.body = c;
  SPR.halo = radial(128, [[0, 'rgba(255,196,120,.62)'], [0.22, 'rgba(255,160,80,.28)'], [0.55, 'rgba(240,120,60,.08)'], [1, 'rgba(240,110,50,0)']]);
  SPR.flame = radial(48, [[0, 'rgba(255,253,235,1)'], [0.25, 'rgba(255,224,150,.85)'], [0.6, 'rgba(255,170,80,.25)'], [1, 'rgba(255,140,60,0)']]);
  SPR.star = radial(48, [[0, 'rgba(255,252,242,1)'], [0.12, 'rgba(255,240,215,.75)'], [0.35, 'rgba(255,214,170,.16)'], [1, 'rgba(255,200,150,0)']]);
  SPR.cool = radial(48, [[0, 'rgba(240,246,255,1)'], [0.14, 'rgba(210,225,255,.5)'], [0.4, 'rgba(170,190,255,.08)'], [1, 'rgba(170,190,255,0)']]);
}

/* ---------- background ---------- */
function rnd(seed){ let s = seed >>> 0 || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function ridge(r, n, rough){
  // midpoint displacement, n = 2^m + 1 points in 0..1
  const a = new Float32Array(n);
  a[0] = r(); a[n - 1] = r();
  for(let step = n - 1, amp = 1; step > 1; step >>= 1, amp *= rough){
    for(let i = step >> 1; i < n; i += step) a[i] = (a[i - (step >> 1)] + a[i + (step >> 1)]) / 2 + (r() - 0.5) * amp;
  }
  let lo = 1e9, hi = -1e9; for(const v of a){ lo = Math.min(lo, v); hi = Math.max(hi, v); }
  for(let i = 0; i < n; i++) a[i] = (a[i] - lo) / (hi - lo || 1);
  return a;
}
function buildBg(){
  const r = rnd(20261017);
  [bg] = mk(Math.round(W * k), Math.round(hz * k));
  const x = bg.getContext('2d'); x.setTransform(k, 0, 0, k, 0, 0);
  // sky
  const g = x.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, '#05070f'); g.addColorStop(0.35, '#0a1026'); g.addColorStop(0.7, '#17203f');
  g.addColorStop(0.9, '#2b2c4c'); g.addColorStop(1, '#3d3450');
  x.fillStyle = g; x.fillRect(0, 0, W, hz);
  // milky-way haze: a soft diagonal band
  x.globalCompositeOperation = 'lighter';
  for(let i = 0; i < 14; i++){
    const t = i / 13, cx = lerp(-0.1, 1.1, t) * W, cy = lerp(0.62, 0.05, t) * hz + Math.sin(t * 5) * hz * 0.04;
    const rad = Math.max(W, hz) * (0.12 + 0.06 * r());
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    rg.addColorStop(0, `rgba(${110 + 40 * r() | 0},${110 + 30 * r() | 0},170,.05)`); rg.addColorStop(1, 'rgba(100,100,160,0)');
    x.fillStyle = rg; x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }
  // stars
  const n = Math.min(520, Math.round(W * hz / 1400));
  twinkleBg = [];
  for(let i = 0; i < n; i++){
    let sx = r() * W, sy = Math.pow(r(), 1.35) * hz * 0.96;
    // denser along the band
    if(i % 3 === 0){ const t = r(); sx = lerp(-0.1, 1.1, t) * W + (r() - 0.5) * W * 0.12; sy = (lerp(0.62, 0.05, t) + (r() - 0.5) * 0.12) * hz; }
    const fade = clamp(1 - sy / hz, 0, 1) ** 0.6;
    const m = r(), size = m > 0.97 ? 1.5 : m > 0.85 ? 1.05 : 0.7;
    const a = (0.18 + 0.6 * r() * r()) * fade;
    if(m > 0.93 && twinkleBg.length < 46 && sy > 40){ twinkleBg.push([sx / W, sy / H, size, r() * TAU, 0.6 + r() * 1.6, a]); continue; }
    const tint = r();
    x.fillStyle = tint < 0.2 ? `rgba(255,220,190,${a})` : tint < 0.45 ? `rgba(200,215,255,${a})` : `rgba(240,240,250,${a})`;
    x.beginPath(); x.arc(sx, sy, size * 0.6, 0, TAU); x.fill();
  }
  // low warm haze along the horizon
  const hg = x.createLinearGradient(0, hz * 0.72, 0, hz);
  hg.addColorStop(0, 'rgba(120,80,90,0)'); hg.addColorStop(1, 'rgba(150,100,100,.16)');
  x.fillStyle = hg; x.fillRect(0, hz * 0.72, W, hz * 0.28);
  // crescent moon
  const mx = W * 0.86, my = Math.max(70, hz * 0.2), mr = clamp(Math.min(W, H) * 0.022, 8, 15);
  const mg = x.createRadialGradient(mx, my, 0, mx, my, mr * 9);
  mg.addColorStop(0, 'rgba(255,236,200,.16)'); mg.addColorStop(1, 'rgba(255,236,200,0)');
  x.fillStyle = mg; x.fillRect(mx - mr * 9, my - mr * 9, mr * 18, mr * 18);
  x.globalCompositeOperation = 'source-over';
  {
    const ms = Math.ceil(mr * 2 + 4), [mc, m] = mk(ms * 2, ms * 2);
    m.scale(2, 2);
    m.beginPath(); m.arc(ms / 2, ms / 2, mr, 0, TAU); m.fillStyle = '#f6e7c4'; m.fill();
    m.globalCompositeOperation = 'destination-out';
    m.beginPath(); m.arc(ms / 2 - mr * 0.42, ms / 2 - mr * 0.3, mr * 0.9, 0, TAU); m.fill();
    x.drawImage(mc, mx - ms / 2, my - ms / 2, ms, ms);
  }
  // mountains, far → near
  const layers = [
    { top: 0.2, h: 0.17, col: ['#2b2d4b', '#30304e'], rough: 0.55, n: 129 },
    { top: 0.11, h: 0.13, col: ['#1b1d35', '#201f38'], rough: 0.5, n: 129 },
    { top: 0.05, h: 0.08, col: ['#0f1122', '#121224'], rough: 0.58, n: 257 }
  ];
  for(const L of layers){
    const a = ridge(r, L.n, L.rough);
    const base = hz, peakY = hz - hz * L.top;
    x.beginPath(); x.moveTo(0, base);
    for(let i = 0; i < L.n; i++){
      const xx = i / (L.n - 1) * W;
      x.lineTo(xx, peakY + (1 - a[i]) * hz * L.h + hz * (L.top - L.h) * 0);
    }
    x.lineTo(W, base); x.closePath();
    const mgrad = x.createLinearGradient(0, peakY, 0, base);
    mgrad.addColorStop(0, L.col[0]); mgrad.addColorStop(1, L.col[1]);
    x.fillStyle = mgrad; x.fill();
  }
  // mist band just above the water
  const fog = x.createLinearGradient(0, hz - hz * 0.06, 0, hz);
  fog.addColorStop(0, 'rgba(70,72,105,0)'); fog.addColorStop(1, 'rgba(70,72,105,.35)');
  x.fillStyle = fog; x.fillRect(0, hz - hz * 0.06, W, hz * 0.06);

  // reflection: flipped sky, dimmed and tinted
  const lh = H - hz;
  [bgR] = mk(Math.round(W * k), Math.max(1, Math.round(lh * k)));
  const y = bgR.getContext('2d');
  y.setTransform(k, 0, 0, -k, 0, hz * k);
  y.drawImage(bg, 0, 0, W, hz);
  y.setTransform(k, 0, 0, k, 0, 0);
  const dg = y.createLinearGradient(0, 0, 0, lh);
  dg.addColorStop(0, 'rgba(10,14,30,.38)'); dg.addColorStop(0.5, 'rgba(7,10,24,.6)'); dg.addColorStop(1, 'rgba(4,6,15,.82)');
  y.fillStyle = dg; y.fillRect(0, 0, W, lh);

  shimmer = [];
  const ns = RM ? 14 : 34;
  for(let i = 0; i < ns; i++) shimmer.push([r(), Math.pow(r(), 1.6), r() * TAU, 0.4 + r() * 0.8]);
}

/* ---------- constellations ---------- */
function mstEdges(g){
  const pts = [];
  for(let i = 0; i < 7; i++){ const s = stars[g * 7 + i]; pts.push([s[0] * W, s[1] * H]); }
  const inT = [true, false, false, false, false, false, false], edges = [];
  for(let n = 1; n < 7; n++){
    let best = 1e18, bi = -1, bj = -1;
    for(let i = 0; i < 7; i++) if(inT[i]) for(let j = 0; j < 7; j++) if(!inT[j]){
      const d = (pts[i][0] - pts[j][0]) ** 2 + (pts[i][1] - pts[j][1]) ** 2;
      if(d < best){ best = d; bi = i; bj = j; }
    }
    inT[bj] = true; edges.push([g * 7 + bi, g * 7 + bj]);
  }
  return edges;
}
function rebuildEdges(){ edgesCache = []; for(let g = 0; g < cons.length; g++) edgesCache.push(mstEdges(g)); }
function pickName(){
  const used = new Set(cons);
  const free = NAMES.filter(n => !used.has(n));
  const list = free.length ? free : NAMES;
  return list[Math.floor(Math.random() * list.length)];
}

/* ---------- sound ---------- */
const PENTA = [196, 220, 246.94, 293.66, 329.63, 392, 440, 493.88, 587.33];
function chime(xn){
  const i = clamp(Math.round(xn * (PENTA.length - 1) + (Math.random() - 0.5) * 1.2), 0, PENTA.length - 1);
  const f = PENTA[i] * 2 * (1 + (Math.random() - 0.5) * 0.006), pan = (xn - 0.5) * 0.8;
  J.sfx.tone({ f, peak: 0.1, dec: 2.2, att: 0.012, wet: 0.65, pan });
  J.sfx.tone({ f: f * 2.002, peak: 0.028, dec: 0.9, att: 0.006, wet: 0.6, pan });
  J.sfx.tone({ f: f * 3.01, peak: 0.012, dec: 0.4, att: 0.004, wet: 0.5, pan });
  J.sfx.tone({ f: f / 2, peak: 0.04, dec: 1.4, att: 0.03, wet: 0.4, pan });
  J.sfx.noise({ type: 'lowpass', freq: 900, freq2: 200, peak: 0.035, dec: 0.4, att: 0.02, pan }); // flame catching
}
function twinkleSound(xn){
  const f = PENTA[Math.floor(Math.random() * PENTA.length)] * 8, pan = (xn - 0.5) * 0.9;
  J.sfx.tone({ f, peak: 0.022, dec: 1.3, att: 0.004, wet: 0.95, pan });
  J.sfx.tone({ f: f * 1.5, peak: 0.01, dec: 0.9, att: 0.004, delay: 0.09, wet: 0.95, pan });
}
function chord(d0 = 0){
  const ch = [146.83, 220, 293.66, 369.99, 440, 659.25, 880];
  ch.forEach((f, i) => J.sfx.tone({ f, peak: i < 2 ? 0.05 : 0.04, dec: 3.6, att: 0.06, delay: d0 + i * 0.11, wet: 0.75, pan: (i / 6 - 0.5) * 0.7 }));
  J.sfx.tone({ f: 1760, peak: 0.012, dec: 2, att: 0.01, delay: d0 + 0.8, wet: 1 });
}

/* ---------- lanterns ---------- */
function spawn(xn, yTap, opts = {}){
  if(lanterns.length >= 48) return;
  const lakeTop = hz / H;
  let y0n = yTap != null && yTap / H > lakeTop + 0.04 ? clamp(yTap / H, lakeTop + 0.06, 0.95) : lerp(lakeTop, 1, 0.55 + Math.random() * 0.25);
  if(opts.ambient) y0n = lakeTop + 0.004 + Math.random() * 0.01;
  const depth = (y0n - lakeTop) / (1 - lakeTop);       // 0 far … 1 near
  const xsn = clamp(xn + (Math.random() - 0.5) * 0.06, 0.04, 0.96);
  const topMin = 46 / H;
  const ysn = opts.ambient ? lakeTop - 0.25 - Math.random() * 0.2 : topMin + Math.random() * (0.45 - topMin);
  lanterns.push({
    x0: xn, y0: y0n, xs: xsn, ys: ysn, depth,
    age: opts.age || 0, T: (opts.ambient ? 22000 : 15000) + Math.random() * 4000,
    ph: Math.random() * TAU, sw: 0.5 + Math.random() * 0.5, fl: Math.random() * 100,
    ambient: !!opts.ambient, size: opts.ambient ? 0.18 : 0.75 + 0.45 * depth
  });
}
function release(xn, yTap){
  spawn(xn, yTap);
  released++; J.store.set('lantern-count', released);
  chime(xn); J.buzz(8); J.stat();
}
function land(L){
  if(L.ambient || L.seed) return;
  if(stars.length >= CAP){
    stars.splice(0, 7); born.splice(0, 7); cons.shift(); consAnim.shift();
  }
  const seed = Math.random();
  stars.push([L.xs, L.ys, 0.8 + 0.5 * Math.random(), seed]);
  born.push(clock);
  twinkleSound(L.xs);
  if(stars.length % 7 === 0){
    cons.push(pickName()); consAnim.push(clock + 700);
    rebuildEdges();
    chord(0.6);
    J.buzz(14);
  }
  saveStars(); J.stat();
}

/* lantern state at time u — position of its bottom-center, scale, brightness */
function lanternState(L){
  const u = clamp(L.age / L.T, 0, 1);
  const lift = smooth(clamp(L.age / 2600, 0, 1));                    // slow lift-off
  const p = 0.5 - 0.5 * Math.cos(Math.PI * Math.pow(u, 0.92));
  const yy = lerp(L.y0, L.ys, p) * H - (1 - lift) * 0;
  const sway = Math.sin(L.age * 0.0009 * L.sw + L.ph) * (1 - u) * (RM ? 0.3 : 1);
  const xx = lerp(L.x0, L.xs, smooth(u)) * W + sway * W * 0.018 * L.size;
  const shrink = Math.pow(1 - u, 1.25);
  const base = clamp(Math.min(W, H) * 0.075, 24, 54) * L.size;
  const sz = base * (0.05 + 0.95 * shrink) * (0.92 + 0.08 * lift);
  return { u, x: xx, y: yy, sz, shrink, rot: sway * 0.07, lift };
}

/* ---------- toy ---------- */
function onDown(e){
  e.preventDefault();
  J.ac();
  const [x, y] = J.local(e, cv);
  release(clamp(x / W, 0.03, 0.97), y);
}

J.register({
  id: 'lantern', name: '点灯笼', hint: '点一下，放一盏灯',
  create(root){
    view = J.canvas(root, { dprMax: 2 });
    cv = view.cv; ctx = view.ctx;
    cv.style.cursor = 'pointer';
    buildSprites();
    cv.addEventListener('pointerdown', onDown);
    for(let i = 0; i < stars.length; i++) born.push(-1e9);
    for(let i = 0; i < cons.length; i++) consAnim.push(-1e9);
  },
  resize(w, h){
    W = w; H = h; hz = Math.round(H * HZ);
    view.fit(w, h); k = view.k;
    buildBg(); rebuildEdges();
    if(!seeded){
      seeded = true;
    // a few lanterns already drifting so the first frame tells the story (they don't become stars)
      for(const [xn, age, sz] of [[0.22, 8200, 0.8], [0.58, 2600, 0.95], [0.8, 12000, 0.7]]){
        spawn(xn, null, {}); const L = lanterns[lanterns.length - 1];
        L.age = age; L.seed = true; L.size = sz; L.y0 = HZ + 0.12; L.T = 17000;
      }
    }
  },
  actions: [
    { label: '放十盏', run(){
      const xs = []; for(let i = 0; i < 10; i++) xs.push((i + 0.5) / 10);
      for(let i = xs.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [xs[i], xs[j]] = [xs[j], xs[i]]; }
      let t = clock;
      for(const xn of xs){ queue.push({ at: t, xn: clamp(xn + (Math.random() - 0.5) * 0.05, 0.04, 0.96) }); t += 380 + Math.random() * 420; }
    } },
    { label: () => clock < confirmUntil ? '再点一次确认' : '清空夜空', on: () => clock < confirmUntil, run(){
      if(clock < confirmUntil){
        stars = []; cons = []; born.length = 0; consAnim.length = 0; edgesCache = [];
        saveStars(); confirmUntil = 0;
        J.sfx.noise({ type: 'lowpass', freq: 1400, freq2: 300, peak: 0.05, dec: 1.2, att: 0.2, wet: 0.6 });
      } else confirmUntil = clock + 3000;
    } }
  ],
  key(e){ if(e.code === 'Space'){ release(0.06 + Math.random() * 0.88, null); return true; } },
  tick(now, dt){
    const prevClock = clock;
    clock += dt;
    if(confirmUntil && prevClock < confirmUntil && clock >= confirmUntil){ confirmUntil = 0; J.acts(); }
    for(let i = queue.length - 1; i >= 0; i--) if(queue[i].at <= clock){ release(queue[i].xn, null); queue.splice(i, 1); }

    // ambient: shooting stars, faraway lanterns
    shootT += dt;
    if(shootT > shootNext){
      shootT = 0; shootNext = (RM ? 40000 : 9000) + Math.random() * (RM ? 30000 : 14000);
      if(!RM || Math.random() < 0.5){
        const sx = W * (0.15 + Math.random() * 0.7), sy = H * (0.06 + Math.random() * 0.22);
        const ang = Math.PI * (0.12 + Math.random() * 0.16) * (Math.random() < 0.5 ? 1 : -1) + (Math.random() < 0.5 ? 0 : 0);
        const sp = Math.min(W, H) * 0.0009 * (0.8 + Math.random() * 0.5);
        const dir = Math.random() < 0.5 ? 1 : -1;
        shoots.push({ x: sx, y: sy, vx: Math.cos(ang) * sp * dir, vy: Math.abs(Math.sin(ang)) * sp, age: 0, life: 900 + Math.random() * 500 });
      }
    }
    ambT += dt;
    if(ambT > ambNext){ ambT = 0; ambNext = (RM ? 30000 : 14000) + Math.random() * 16000; spawn(0.08 + Math.random() * 0.84, null, { ambient: true }); }

    for(let i = lanterns.length - 1; i >= 0; i--){
      const L = lanterns[i]; L.age += dt;
      if(L.age >= L.T){ lanterns.splice(i, 1); land(L); }
    }

    /* ---- draw ---- */
    const c = ctx, t = clock;
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    c.drawImage(bg, 0, 0, W, hz);
    // lake reflection with gentle wave distortion
    const lh = H - hz, amp = RM ? 0.5 : 1;
    for(let y = 0; y < lh; y += 2){
      const d = y / lh;
      const off = (Math.sin(Math.pow(y + 4, 0.75) * 1.3 - t * 0.0016) * (0.6 + 3.2 * d) + Math.sin(y * 0.37 + t * 0.0011) * 0.5 * d) * amp;
      c.drawImage(bgR, 0, y * k, bgR.width, 2 * k, off - 4, hz + y, W + 8, 2.6);
    }
    // horizon line + soft lake vignette
    c.fillStyle = 'rgba(160,150,190,.10)'; c.fillRect(0, hz, W, 1);

    c.globalCompositeOperation = 'lighter';
    // twinkling background stars
    for(const s of twinkleBg){
      const a = s[5] * (0.55 + 0.45 * Math.sin(t * 0.001 * s[4] + s[3]));
      if(a < 0.02) continue;
      const r = 3 + s[2] * 3;
      c.globalAlpha = a; c.drawImage(SPR.cool, s[0] * W - r, s[1] * H - r, r * 2, r * 2);
    }
    // constellation lines
    c.lineCap = 'round';
    for(let g = 0; g < edgesCache.length; g++){
      const E = edgesCache[g], start = consAnim[g];
      const prog = (clock - start) / 650;            // edges drawn one by one
      if(prog <= 0) continue;
      c.lineWidth = 1;
      let lx = 0, ly = 0, maxY = 0, n = 0;
      for(let e = 0; e < E.length; e++){
        const f = clamp(prog - e, 0, 1);
        if(f <= 0) break;
        const a = stars[E[e][0]], b = stars[E[e][1]];
        if(!a || !b) break;
        const ax = a[0] * W, ay = a[1] * H, bx = b[0] * W, by = b[1] * H;
        const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, gap = Math.min(6, len * 0.3);
        const sx = ax + dx / len * gap, sy = ay + dy / len * gap;
        const ex = sx + (dx - dx / len * gap * 2) * smooth(f), ey = sy + (dy - dy / len * gap * 2) * smooth(f);
        c.globalAlpha = clamp(1.25 - len / (Math.max(W, H) * 0.55), 0.35, 1);
        c.strokeStyle = 'rgba(255,226,180,.22)';
        c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
      }
      for(let i = 0; i < 7; i++){ const s = stars[g * 7 + i]; if(s){ lx += s[0] * W; ly += s[1] * H; maxY = Math.max(maxY, s[1] * H); n++; } }
      const la = clamp((prog - E.length) / 1.6, 0, 1);
      if(la > 0 && n){
        c.globalCompositeOperation = 'source-over';
        c.globalAlpha = la * 0.62;
        c.font = `${W < 520 ? 12 : 14}px ${FONT}`;
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = '#e8d6b4';
        const tx = clamp(lx / n, 40, W - 40), ty = clamp(ly / n + 4, 48, hz - 30);
        c.fillText(cons[g], tx, ty);

  const gy = (y, strong) => { g.fillStyle = strong ? 'rgba(220,240,226,.17)' : 'rgba(220,240,226,.075)'; g.fillRect(m.x, y - .5, m.w, 1); };
  let i0 = Math.ceil((m.x - gx0) / u);
  for(let i = i0; gx0 + i * u < m.x + m.w; i++) gx(gx0 + i * u, ((i % 5) + 5) % 5 === 0);
  i0 = Math.ceil((m.y - gy0) / u);
  for(let i = i0; gy0 + i * u < m.y + m.h; i++) gy(gy0 + i * u, ((i % 5) + 5) % 5 === 0);
  // diagonal guide lines in corners, like a cutting mat
  g.strokeStyle = 'rgba(220,240,226,.06)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(m.x, m.y + m.h); g.lineTo(m.x + Math.min(m.w, m.h) * .5, m.y + m.h - Math.min(m.w, m.h) * .5); g.stroke();
  // edge ticks
  g.fillStyle = 'rgba(240,220,170,.35)';
  for(let i = Math.ceil((m.x - gx0) / u); gx0 + i * u < m.x + m.w; i++){ const L = ((i % 5) + 5) % 5 === 0 ? 7 : 3.5; g.fillRect(gx0 + i * u - .5, m.y + m.h - L, 1, L); }

  const px = W * .38, py = H * .2, R = Math.max(W, H) * .95;
  let lg = g.createRadialGradient(px, py, 0, px, py, R);
  lg.addColorStop(0, 'rgba(255,200,130,.17)'); lg.addColorStop(.4, 'rgba(255,170,100,.06)'); lg.addColorStop(1, 'rgba(255,150,80,0)');

/* ---------- render ---------- */
function drawItem(it){
  const S = it.spr; if(!S) return;
  const lift = it.lift;
  const sc = 1 + lift * .07;
  const ox = u * (.18 + lift * .9), oy = u * (.3 + lift * 1.4);
  const c = Math.cos(it.a) * sc, s = Math.sin(it.a) * sc;
  ctx.setTransform(k * c, k * s, -k * s, k * c, k * (it.x + ox), k * (it.y + oy));
  ctx.globalAlpha = .34 - lift * .1;
  ctx.drawImage(S.soft, -S.sw / 2, -S.sh / 2, S.sw, S.sh);
  ctx.setTransform(k * c, k * s, -k * s, k * c, k * (it.x + u * .06), k * (it.y + u * .1));
  ctx.globalAlpha = .4 * (1 - lift * 1.2 < 0 ? 0 : 1 - lift * 1.2);
  if(ctx.globalAlpha > .01) ctx.drawImage(S.hard, -S.sw / 2, -S.sh / 2, S.sw, S.sh);
  ctx.globalAlpha = 1;
  ctx.setTransform(k * c, k * s, -k * s, k * c, k * it.x, k * it.y);
  ctx.drawImage(S.body, -S.sw / 2, -S.sh / 2, S.sw, S.sh);
}
function render(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if(bgc) ctx.drawImage(bgc, 0, 0);
  for(const it of items) drawItem(it);
  ctx.setTransform(k, 0, 0, k, 0, 0);
}

/* ---------- tick ---------- */
function step(t){
  let anyAnim = false;
  for(const it of items){
    const A = it.anim;
    if(!A){ it.lift += ((drag && drag.it === it ? 1 : 0) - it.lift) * .3; if(Math.abs(it.lift) < .002) it.lift = drag && drag.it === it ? it.lift : 0; continue; }
    anyAnim = true;
    let p = (t - A.t0) / A.dur;
    if(p < 0){ continue; }
    if(p > 1) p = 1;
    let e, lift = 0;
    if(A.kind === 'knoll'){ e = easeIO(p); lift = Math.sin(Math.PI * Math.min(1, p * 1.05)) * .55; }
    else if(A.kind === 'hop'){ e = 1; lift = Math.sin(Math.PI * p) * .5; }
    else if(A.kind === 'scatter'){ e = easeOut(p); lift = Math.sin(Math.PI * p) * .35; }
    else if(A.kind === 'snap'){ e = easeOutBack(p); lift = (1 - p) * .6; }
    else { e = easeOut(p); }
    it.x = A.x0 + (A.x1 - A.x0) * e; it.y = A.y0 + (A.y1 - A.y0) * e; it.a = A.a0 + (A.a1 - A.a0) * e;
    it.lift = lift;
    if(p >= 1){
      it.x = A.x1; it.y = A.y1; it.a = wrapA(A.a1); it.lift = 0;
      if(Math.abs(it.a - Math.round(it.a / HP) * HP) < 1e-6) it.a = Math.round(it.a / HP) * HP;
      it.anim = null; busy--;
      if(A.kind === 'knoll' || A.kind === 'hop'){
        const m = step_(A.idx, A.n);
        sLand(it, m, A.kind === 'hop'); J.buzz(3);
      } else if(A.kind === 'snap'){ sLand(it, .9 + Math.random() * .2, false); J.buzz(7); }
      else if(A.kind === 'scatter'){ if(t - lastSnd > 30 && Math.random() < .5){ lastSnd = t; sLand(it, .8 + Math.random() * .4, true); } }
      saveFrac(it);
      statT = t + 60;
    }
  }
  if(endChord && t >= endChord){ endChord = 0; if(knolled) sChord(); }
  return anyAnim;
}
const step_ = (i, n) => pent(Math.round(i / Math.max(1, n - 1) * 9)) * .9;
function saveFrac(it){ it.fx = (it.x - mat.x) / mat.w; it.fy = (it.y - mat.y) / mat.h; }

/* ---------- input ---------- */
function hit(x, y){
  for(let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    const dx = x - it.x, dy = y - it.y, c = Math.cos(it.a), s = Math.sin(it.a);
    const lx = dx * c + dy * s, ly = -dx * s + dy * c;
    const hw = it.w * u / 2 + u * .3, hh = Math.max(it.h * u / 2, u * .9) + u * .3;
    if(Math.abs(lx) <= hw && Math.abs(ly) <= hh) return it;
  }
  return null;
}

J.register({
  id: 'tidy', name: '整理癖', hint: '拖一拖，或者一键整理',
  create(root){
    cobj = J.canvas(root); cv = cobj.cv; ctx = cobj.ctx;
    items = makeItems();
    cv.addEventListener('pointerdown', e => {
      e.preventDefault(); J.ac();
      if(drag) return;
      const [x, y] = J.local(e, cv);
      const it = hit(x, y);
      if(!it) return;
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
      if(it.anim){ busy--; it.anim = null; }
      items.splice(items.indexOf(it), 1); items.push(it);
      drag = { id: e.pointerId, it, dx: it.x - x, dy: it.y - y, sx: x, sy: y };
      knolled = false;
      sLift(it); J.buzz(3);
      dirty = true;
    });
    cv.addEventListener('pointermove', e => {
      if(!drag || e.pointerId !== drag.id) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
      const ev = evs && evs.length ? evs[evs.length - 1] : e;
      const [x, y] = J.local(ev, cv);
      const it = drag.it;
      const ab = aabb(it, 0, 0, it.a);
      it.x = clamp(x + drag.dx, play.x0 + ab[2] * .3, play.x1 - ab[2] * .3);
      it.y = clamp(y + drag.dy, play.y0 + ab[3] * .3, play.y1 - ab[3] * .3);
      dirty = true;
    });
    const up = e => {
      if(!drag || e.pointerId !== drag.id) return;
      const it = drag.it; drag = null;
      snapDrop(it);
      dirty = true;
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    try{ document.fonts && document.fonts.ready.then(() => { if(W) buildSprites(); }); }catch(e){}
  },
  resize(W2, H2){
    const first = !W;
    W = W2; H = H2;
    cobj.fit(W, H); k = cobj.k;
    const pad = W < 520 ? 8 : 12;
    mat = { x: pad, y: pad, w: W - pad * 2, h: H - pad * 2 };
    const inset = W < 520 ? 10 : 18;
    play = { x0: mat.x + inset, y0: Math.max(mat.y + inset, 40), x1: mat.x + mat.w - inset, y1: mat.y + mat.h - inset };
    layoutChoice = chooseLayout(play.x1 - play.x0, play.y1 - play.y0);
    const cap = Math.sqrt(W * H) / 46;
    u = Math.max(4, Math.min(layoutChoice.u * .93, cap));
    gx0 = mat.x + ((mat.w - Math.floor(mat.w / u) * u) / 2);
    gy0 = mat.y + ((mat.h - Math.floor(mat.h / u) * u) / 2);
    drawBg(); buildSprites();
    if(first){ scatter(true); }
    else if(knolled){
      const T = knollTargets();
      for(const it of items){ if(it.anim){ it.anim = null; } const t = T.get(it); it.x = t[0]; it.y = t[1]; it.a = t[2]; it.lift = 0; }
      busy = 0;
    } else {
      for(const it of items){
        if(it.anim){ it.x = it.anim.x1; it.y = it.anim.y1; it.a = it.anim.a1; it.anim = null; }
        const ab = aabb(it, 0, 0, it.a);
        it.x = clamp(mat.x + it.fx * mat.w, play.x0 + ab[2], play.x1 - ab[2]);
        it.y = clamp(mat.y + it.fy * mat.h, play.y0 + ab[3], play.y1 - ab[3]);
        it.lift = 0;
      }
      busy = 0;
    }
    for(const it of items) saveFrac(it);
    neat = neatness(); J.stat();
    dirty = true;
  },
  enter(){ dirty = true; },
  tick(t){
    now = t;
    const anim = step(t);
    let lifting = false;
    for(const it of items) if(it.lift > 0) { lifting = true; break; }
    if(statT && t >= statT && !anim && !drag){ statT = 0; neat = neatness(); J.stat(); }
    if(dirty || anim || drag || lifting){ render(); dirty = false; }
  },
  key(e){ if(e.code === 'Space'){ knoll(); return true; } },
  actions: [
    { label: '一键整理', run(){ knoll(); } },
    { label: '弄乱', run(){ scatter(false); } }
  ],
  stat(){ return '整齐度 <b>' + neat + '%</b>'; }
});
})();

    refBuf[i * 2] = zx; refBuf[i * 2 + 1] = zy;

  pointers.set(e.pointerId, { x, y, x0: x, y0: y, t0: performance.now(), lt: performance.now(), moved: 0 });
  F.vel = null;
  if(pointers.size === 2){ for(const p of pointers.values()) p.moved = 99; }
}
function onMove(e){
  const p = pointers.get(e.pointerId); if(!p) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  const last = evs && evs.length ? evs[evs.length - 1] : e;
  const [x, y] = J.local(last, cv);
  const now = performance.now();
  if(pointers.size === 1){
    const dx = x - p.x, dy = y - p.y;
    p.moved = Math.max(p.moved, Math.hypot(x - p.x0, y - p.y0));
    if(p.moved > 7){
      if(F.auto || F.dive || F.anim){ userTakesOver(); F.anim = null; }
      const [ddx, ddy] = screenDelta(dx, dy);
      F.x -= ddx; F.y -= ddy; F.dirty = true;
      const dtp = Math.max(4, now - p.lt) / 1000;
      const vx = -ddx / dtp, vy = -ddy / dtp;
      p.vx = p.vx === undefined ? vx : p.vx * .6 + vx * .4; p.vy = p.vy === undefined ? vy : p.vy * .6 + vy * .4;
    }
  } else if(pointers.size === 2){
    userTakesOver(); F.anim = null;
    const [a, b] = [...pointers.values()];
    const ocx = (a.x + b.x) / 2, ocy = (a.y + b.y) / 2, od = Math.hypot(a.x - b.x, a.y - b.y);
    p.x = x; p.y = y;
    const ncx = (a.x + b.x) / 2, ncy = (a.y + b.y) / 2, nd = Math.hypot(a.x - b.x, a.y - b.y);
    const [ddx, ddy] = screenDelta(ncx - ocx, ncy - ocy);
    F.x -= ddx; F.y -= ddy;
    if(od > 10 && nd > 10) zoomAt(ncx, ncy, clamp(od / nd, .5, 2));
    clampScale(); F.dirty = true;
  }
  p.x = x; p.y = y; p.lt = now;
}
function onUp(e){
  const p = pointers.get(e.pointerId); if(!p) return;
  pointers.delete(e.pointerId);
  const now = performance.now();
  if(e.type === 'pointerup' && p.moved <= 7 && now - p.t0 < 350 && pointers.size === 0){
    const lt = F.lastTap;
    if(lt && now - lt.t < 330 && Math.hypot(p.x - lt.sx, p.y - lt.sy) < 40){ userTakesOver(); zoomOut(); }
    else { userTakesOver(); tapZoom(p.x, p.y); }
    return;
  }
  if(p.vx !== undefined && pointers.size === 0 && now - p.lt < 80){
    const sp = Math.hypot(p.vx, p.vy);
    if(sp > F.s * .05) F.vel = { x: p.vx, y: p.vy };
  }
}
function onWheel(e){
  e.preventDefault(); J.ac(); F.touched = true;
  userTakesOver(); F.anim = null;
  const [x, y] = J.local(e, cv);
  const dy = e.deltaMode === 1 ? e.deltaY * 18 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  const w = F.wheel || (F.wheel = { z: 0, x, y });
  w.z += clamp(dy, -240, 240) * .0022; w.x = x; w.y = y;
}
function clampScale(){
  if(F.s > F.home.s * 3){ const f = F.home.s * 3 / F.s; zoomAt(F.W / 2, F.H / 2, f); }
}

/* ---------- per frame ---------- */
function tick(now, dt){
  const sdt = dt / 1000;
  F.time += sdt;
  // palette breathes slowly around a calm phase (far exterior stays indigo, filaments go teal → amber)
  F.pal = .47 + (reduce ? .03 : .085) * Math.sin(F.time * .045) + .03 * Math.sin(F.time * .017 + 1);
  F.ema = F.ema * .9 + dt * .1;
  padSync();

  const before = F.x + ',' + F.y + ',' + F.s + ',' + F.r;
  if(F.auto && F.dive && !pointers.size) driftTick(sdt);
  if(F.anim){
    const A = F.anim; A.t += sdt; const u = clamp(A.t / A.dur, 0, 1), e = ease(u);
    F.s = Math.exp(Math.log(A.s0) + (Math.log(A.s1) - Math.log(A.s0)) * e);
    F.x = A.x0 + (A.x1 - A.x0) * e; F.y = A.y0 + (A.y1 - A.y0) * e; F.r = A.r0 + (A.r1 - A.r0) * e;
    if(u >= 1) F.anim = null;
    J.stat();
  }
  if(F.wheel){
    const w = F.wheel, take = w.z * (1 - Math.exp(-sdt / .07));
    w.z -= take; zoomAt(w.x, w.y, Math.exp(take));
    if(Math.abs(w.z) < 1e-4) F.wheel = null;
    clampScale(); J.stat();
  }
  if(F.vel){
    F.x += F.vel.x * sdt; F.y += F.vel.y * sdt;
    const k = Math.exp(-sdt * 3.4); F.vel.x *= k; F.vel.y *= k;
    if(Math.hypot(F.vel.x, F.vel.y) < F.s * .01) F.vel = null;
  }
  // depth limit: float precision runs out — fade and set sail again
  if(F.s < F.sMin){
    F.anim = null; F.wheel = null; F.vel = null;
    showToast('到底了，重新起航');
    if(F.auto) startDive(false);
    else { startFade(.1, 1.8); Object.assign(F, { x: F.home.x, y: F.home.y, s: F.home.s, r: F.home.r }); }
    J.stat();
  }
  if(F.fade){ F.fade.t += sdt; if(F.fade.t >= F.fade.dur) F.fade = null; }
  if(F.toastT > 0){ F.toastT -= sdt; if(F.toastT <= 0) toast.classList.remove('on'); }

  const after = F.x + ',' + F.y + ',' + F.s + ',' + F.r;
  if(after !== before || F.dirty){ F.lastMove = now; F.dirty = false; F.needIter = true; F.fullDone = false; }

  F.skip = (F.skip || 0) + 1;
  const slow = F.q <= .22 && F.ema > 30;
  if(!F.gl){ c2Tick(now); }
  else if(F.needIter && (!slow || F.skip >= 2)){
    // adapt the moving-resolution to the measured frame time
    if(F.ema > 24) F.q = Math.max(.22, F.q * .93); else if(F.ema < 18.5) F.q = Math.min(1, F.q * 1.03);
    iterate(Math.round(F.q * 20) / 20);
    F.needIter = false; F.shown = false; F.skip = 0;
  } else if(F.needIter){ F.shown = false;
  } else if(!F.fullDone && now - F.lastMove > 160){
    if(!F.lost && glRefine()){ F.fullDone = true; F.shown = false; }
  }
  // the 2D fallback bakes colours in; recolour (cheap, no iteration) now and then so the palette drift shows there too
  if(!F.gl && !C2.job && ((F.time * 2) | 0) !== F.c2tick){ F.c2tick = (F.time * 2) | 0; if(C2.show){ c2Color(C2.show); F.shown = false; } }
  if(!F.gl && (F.needIter || F.anim || F.vel || F.wheel || F.dive)) F.shown = false;
  // only redraw when something changed; when idle, a slow refresh is enough for the palette drift
  if(!F.shown || F.fade || now - F.lastPresent > 180){ present(); F.lastPresent = now; F.shown = true; }
}

J.css(`
.fractal-toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:22px;letter-spacing:.2em;color:var(--ink);
  background:rgba(18,20,28,.55);padding:10px 22px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .7s;z-index:5;white-space:nowrap}
.fractal-toast.on{opacity:1}
.fractal-label{position:absolute;left:16px;bottom:14px;color:rgba(236,230,214,.72);font-size:12px;letter-spacing:.22em;pointer-events:none;opacity:0;transition:opacity 1.6s;z-index:5;
  text-shadow:0 1px 6px rgba(0,0,0,.7)}
.fractal-label.on{opacity:1}
`);

J.register({
  id: 'fractal', name: '分形漂流', hint: '点哪里就往哪里放大，或者打开自动漂流',
  create(r){
    root = r;
    cv = document.createElement('canvas'); root.appendChild(cv);
    cv.style.cursor = 'zoom-in';
    let gl = null;
    try{ gl = cv.getContext('webgl2', { failIfMajorPerformanceCaveat: true, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' }); }catch(e){ gl = null; }
    if(gl){
      F.gl = gl;
      try{ initGL(); }catch(err){ console.warn('[fractal] WebGL2 shader failed, falling back', err); F.gl = null; }
      // software rasterisers (no GPU) get a much smaller internal resolution
      try{
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        const name = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '');
        if(/swiftshader|llvmpipe|software|basic render/i.test(name)){ F.soft = true; F.maxItCap = 1600; }
      }catch(err){}
    }
    if(!F.gl){
      // a WebGL context may have been taken already; start over with a fresh canvas for 2D
      if(gl){ const c2 = document.createElement('canvas'); root.replaceChild(c2, cv); cv = c2; cv.style.cursor = 'zoom-in'; }
      C2.ctx = cv.getContext('2d'); F.sMin = 4e-10; F.maxItCap = 1400;
    }
    cv.addEventListener('webglcontextlost', e => { e.preventDefault(); F.lost = true; });
    cv.addEventListener('webglcontextrestored', () => {
      try{ initGL(); F.lost = false; F.dirty = true; F.fullDone = false; }catch(err){ console.warn('[fractal] restore failed', err); }
    });
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    cv.addEventListener('wheel', onWheel, { passive: false });
    cv.addEventListener('contextmenu', e => { e.preventDefault(); userTakesOver(); zoomOut(); });
    toast = document.createElement('div'); toast.className = 'fractal-toast'; root.appendChild(toast);
    label = document.createElement('div'); label.className = 'fractal-label'; root.appendChild(label);
  },
  resize(W, H){
    const first = !F.W;
    F.W = W; F.H = H;
    F.base = F.soft ? .5 : Math.min(window.devicePixelRatio || 1, F.gl ? 1.5 : 1);
    C2.vig = null;
    cv.width = Math.max(1, Math.round(W * F.base)); cv.height = Math.max(1, Math.round(H * F.base));
    const oldHome = F.home.s;
    setHome();
    if(first){
      Object.assign(F, { x: F.home.x, y: F.home.y, s: F.home.s, r: F.home.r });
      if(F.auto) startDive('first');
      if(F.dive){ F.dive.s0 = F.s; F.dive.x0 = F.x; F.dive.y0 = F.y; }
    } else if(!F.auto && Math.abs(F.s - oldHome) < 1e-9){ Object.assign(F, { x: F.home.x, y: F.home.y, s: F.home.s, r: F.home.r }); }
    F.dirty = true; F.fullDone = false;
    if(F.gl ? !F.lost : true){ iterate(F.q); present(); }
  },
  enter(){ F.dirty = true; F.fullDone = false; F.shown = false; F.ema = 16; },
  leave(){ padStop(); pointers.clear(); },
  tick,
  key(e){
    if(e.code === 'Space'){ setAuto(!F.auto); return true; }
    if(e.key === '-' || e.key === '_'){ userTakesOver(); zoomOut(); return true; }
    if(e.key === '+' || e.key === '='){ userTakesOver(); tapZoom(F.W / 2, F.H / 2); return true; }
  },
  actions: [
    { label: () => F.auto ? '自动漂流：开' : '自动漂流：关', on: () => F.auto, run(){ F.touched = true; setAuto(!F.auto); } },
    { label: '回到起点', run(){ F.touched = true; goHome(); } }
  ],
  stat: () => `放大 <b>${fmtMag(magnification())}</b> 倍`
});
})();

</script>
<script>J.start();</script>
</body>
