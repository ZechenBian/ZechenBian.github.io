<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Zechen Bian">
<meta name="copyright" content="© 2026 Zechen Bian. All rights reserved.">
<meta name="robots" content="noai, noimageai">
<meta name="description" content="诺贝尔文学奖与和平奖的互动体验：马尔克斯的“马孔多，一百年”，曼德拉与德克勒克的“从牢房到投票站”。">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }
.site-foot { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.site-foot a { color: inherit; }
</style>
<title>文学与和平</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: a night-lit instrument room — an idea-lineage map as the hero, a ledger of ten prizes,
   and per-prize pages that pair the argument (left) with a working bench instrument (right). */
:root {
  color-scheme: dark;
  --bg: #0c1018; --bg2: #111724; --panel: #141b29; --fg: #e9e5da; --muted: #959daf; --line: #2a3447;
  --grid: rgba(149,157,175,.15);
  --accent: #dcb05a;               /* medal gold */
  --phy: #8aabff; --chem: #5ccaae; --med: #ef8d9b; --econ: #c4a3ff;
  --s1: #7fb3ff; --s2: #f2a65a; --s3: #8fd694; --s4: #d79bff; --good: #6fcf97; --warn: #ff8a65;
  --display-font: "Newsreader", "Noto Serif SC", Georgia, serif;
  --cjk-display: "Noto Serif SC", "Songti SC", serif;
  --body-font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono-font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f2f4f8; --bg2: #e8ecf2; --panel: #ffffff; --fg: #151a25; --muted: #586174; --line: #d2d8e3;
    --grid: rgba(88,97,116,.14); --accent: #946a10;
    --phy: #2f58c8; --chem: #0d8468; --med: #c03852; --econ: #7944c8;
    --s1: #1f66d1; --s2: #c4600c; --s3: #2e873b; --s4: #8a3fc4; --good: #2e873b; --warn: #c8452a;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f4f8; --bg2: #e8ecf2; --panel: #ffffff; --fg: #151a25; --muted: #586174; --line: #d2d8e3;
  --grid: rgba(88,97,116,.14); --accent: #946a10;
  --phy: #2f58c8; --chem: #0d8468; --med: #c03852; --econ: #7944c8;
  --s1: #1f66d1; --s2: #c4600c; --s3: #2e873b; --s4: #8a3fc4; --good: #2e873b; --warn: #c8452a;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body-font); font-size: 15px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { overflow-x: clip; max-width: 1320px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 0 64px; }
.mono { font-family: var(--mono-font); font-variant-numeric: tabular-nums; }
.f-phy { --f: var(--phy); } .f-chem { --f: var(--chem); } .f-med { --f: var(--med); } .f-econ { --f: var(--econ); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .06em; color: var(--f, var(--muted)); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--f, var(--muted)); }

/* ---------- top bar ---------- */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-block: 22px 8px; flex-wrap: wrap; }
.brand { font-family: var(--cjk-display); font-weight: 900; font-size: 18px; letter-spacing: .08em; text-decoration: none; }
.brand small { font-family: var(--mono-font); font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: .12em; margin-left: 10px; }
.top nav { display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
.top nav a { text-decoration: none; } .top nav a:hover { color: var(--fg); }

/* ---------- home: hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 18px clamp(20px, 4vw, 56px); align-items: end; padding-block: 28px 18px; }
.hero .lineage { grid-column: 1 / -1; margin-top: 18px; }
.hero .nw { white-space: nowrap; }
.hero h1 { font-family: var(--cjk-display); font-weight: 900; font-size: clamp(30px, 5vw, 62px); line-height: 1.12; margin: 0 0 18px; text-wrap: balance; letter-spacing: .02em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--muted); max-width: 34em; margin: 0 0 12px; }
.kicker { font-family: var(--mono-font); font-size: 12px; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; margin-bottom: 14px; }
.stats { display: flex; gap: 22px 36px; flex-wrap: wrap; justify-content: flex-start; padding-bottom: 14px; }
.stats div { display: grid; }
.stats b { font-family: var(--display-font); font-size: 30px; font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.lineage { min-width: 0; }
.lineage .cap { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.lineage-scroll { overflow-x: auto; overflow-y: hidden; }
.lineage svg { display: block; width: 100%; min-width: 1100px; height: auto; }
.lineage .edge { fill: none; stroke: var(--line); stroke-width: 1.4; transition: stroke .2s, opacity .2s; }
.lineage .edge-label { font-size: 12px; fill: var(--muted); transition: opacity .2s; }
.lineage .node circle { fill: var(--panel); stroke: var(--f); stroke-width: 1.6; transition: r .2s; }
.lineage .node .yr { font-family: var(--mono-font); font-size: 11px; fill: var(--f); }
.lineage .node .nm { font-family: var(--body-font); font-size: 13px; fill: var(--fg); font-weight: 500; }
.lineage .node .gl { font-family: var(--display-font); font-size: 15px; fill: var(--fg); font-style: italic; }
.lineage .node { cursor: pointer; }
.lineage .axis { stroke: var(--line); }
.lineage .era { font-family: var(--mono-font); font-size: 10px; fill: var(--muted); letter-spacing: .1em; }
.lineage.hl .edge { opacity: .25; } .lineage.hl .edge-label { opacity: .2; }
.lineage.hl .edge.on { opacity: 1; stroke: var(--accent); } .lineage.hl .edge-label.on { opacity: 1; fill: var(--fg); }
.lineage .node:hover circle, .lineage .node:focus circle { stroke-width: 2.6; }

/* ---------- home: ledger ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 36px 0 14px; border-top: 1px solid var(--line); padding-top: 18px; }
.bar h2 { font-family: var(--cjk-display); font-size: 20px; margin: 0; letter-spacing: .06em; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.filters button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
.ledger { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.card { display: grid; align-content: start; gap: 6px; padding: 18px 18px 20px; background: var(--bg); text-decoration: none; min-width: 0; transition: background .2s; }
.card:hover { background: var(--bg2); }
.card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .yr { font-family: var(--display-font); font-size: 34px; line-height: 1; color: var(--accent); font-variant-numeric: lining-nums; }
.card h3 { font-family: var(--cjk-display); font-size: 19px; margin: 6px 0 0; line-height: 1.35; }
.card .who { font-size: 13px; color: var(--muted); }
.card .eq { font-size: 15px; color: var(--fg); min-height: 30px; overflow-x: auto; overflow-y: hidden; }
.card .one { font-size: 13.5px; color: var(--muted); line-height: 1.7; margin: 2px 0 0; }
.card[hidden] { display: none !important; }
.ledger-empty { padding: 12px 0; color: var(--muted); }

.new26 { margin-top: 36px; display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 18px 32px; border-top: 1px solid var(--line); padding-top: 18px; }
.new26 h2 { font-family: var(--cjk-display); font-size: 20px; margin: 0; letter-spacing: .06em; }
.new26 h2 small { display: block; font-family: var(--mono-font); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .1em; margin-top: 6px; }
.new26 ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 28px; }
.new26 li { display: grid; gap: 2px; min-width: 0; }
.new26 li b { font-weight: 500; }
.new26 li span { color: var(--muted); font-size: 13.5px; }
.new26 li a { font-size: 12.5px; color: var(--accent); text-decoration: none; }
.foot { margin-top: 48px; color: var(--muted); font-size: 12.5px; max-width: 60em; }

/* ---------- detail ---------- */
.crumbs { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 8px 0; font-size: 13px; }
.crumbs a { text-decoration: none; color: var(--muted); } .crumbs a:hover { color: var(--fg); }
.crumbs .pn { display: flex; gap: 16px; }
.dhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 28px; align-items: end; padding-block: 26px 22px; border-bottom: 1px solid var(--line); }
.dhead .bigyr { font-family: var(--display-font); font-size: clamp(64px, 11vw, 132px); line-height: .85; color: var(--accent); font-variant-numeric: lining-nums; grid-row: span 2; letter-spacing: -.02em; }
.dhead h1 { font-family: var(--cjk-display); font-weight: 900; font-size: clamp(28px, 4vw, 44px); line-height: 1.2; margin: 6px 0 0; text-wrap: balance; }
.dhead .meta { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.dhead .awarded { font-size: 12px; color: var(--muted); }
.laureates { display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 12px; grid-column: 1 / -1; }
.laureates div { display: grid; line-height: 1.4; }
.laureates b { font-weight: 500; font-size: 16px; }
.laureates span { font-size: 12.5px; color: var(--muted); font-family: var(--display-font); font-style: italic; }
.laureates i { font-style: normal; font-family: var(--mono-font); font-size: 11px; color: var(--accent); }
.cite { grid-column: 1 / -1; margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.cite b { color: var(--fg); font-weight: 500; }
.lead { font-family: var(--cjk-display); font-weight: 600; font-size: clamp(18px, 2.1vw, 22px); line-height: 1.6; margin: 26px 0 0; max-width: 36em; text-wrap: pretty; }

.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); grid-template-areas: "a lab" "b lab"; gap: 0 clamp(24px, 4vw, 56px); margin-top: 8px; }
.part-a { grid-area: a; min-width: 0; } .part-b { grid-area: b; min-width: 0; }
.labcol { grid-area: lab; min-width: 0; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); margin-top: 28px; max-height: calc(100vh - 28px); overflow-y: auto; overscroll-behavior: contain; }
@media (max-width: 1020px) {
  .dgrid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "a" "lab" "b"; }
  .labcol { position: static; max-height: none; overflow: visible; }
}
.sec { padding-block: 26px 4px; max-width: 42em; }
.sec h2 { font-family: var(--mono-font); font-size: 12px; font-weight: 600; letter-spacing: .16em; color: var(--accent); margin: 0 0 10px; text-transform: uppercase; }
.sec h2 span { font-family: var(--cjk-display); font-size: 19px; letter-spacing: .04em; color: var(--fg); margin-left: 10px; text-transform: none; }
.sec p, .sec li { margin: 0 0 10px; }
.sec ul, .sec ol { padding-left: 1.3em; margin: 0 0 10px; }
.sec b { font-weight: 700; color: var(--fg); }
.sec.math { max-width: none; }
.sec.math .mbody { background: var(--bg2); border-radius: var(--r); padding: 16px 18px 6px; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; margin: .6em 0 !important; }
mjx-container { color: var(--fg); }
.myths li { list-style: none; position: relative; padding-left: 0; }
.myths ul { padding-left: 0; }
.myths li::before { content: "✕"; color: var(--warn); font-size: 12px; margin-right: 8px; }
.papers li { font-size: 13.5px; color: var(--muted); }
.papers i { color: var(--fg); }
.links-list { display: grid; gap: 8px; }
.links-list a { text-decoration: none; display: flex; gap: 10px; align-items: baseline; }
.links-list a:hover b { text-decoration: underline; }
.links-list .dir { font-family: var(--mono-font); font-size: 12px; color: var(--muted); width: 3.5em; flex: none; }
.links-list small { color: var(--muted); }

/* ---------- lab bench ---------- */
.bench { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.bench-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.bench-head .k { font-family: var(--mono-font); font-size: 11px; letter-spacing: .16em; color: var(--accent); }
.bench-head h2 { font-family: var(--cjk-display); font-size: 18px; margin: 2px 0 4px; }
.bench-head p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.65; }
.lab { padding: 12px 14px 14px; display: grid; gap: 12px; min-width: 0; }
.lab-stage { display: grid; gap: 8px; min-width: 0; }
.lab > *, .lab-stage > * { min-width: 0; max-width: 100%; }
.lab-canvas { display: block; border-radius: 6px; background: var(--panel); max-width: 100%; touch-action: pan-y; }
.lab-controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 16px; align-items: end; }
.ctl { display: grid; gap: 4px; min-width: 0; font-size: 13px; }
.ctl-lab { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ctl-val { font-family: var(--mono-font); font-variant-numeric: tabular-nums; color: var(--fg); font-size: 12px; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.ctl input[type=text] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.ctl-choice { grid-column: 1 / -1; }
.segs { display: flex; flex-wrap: wrap; gap: 4px; }
.seg { font: inherit; font-size: 12.5px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.seg[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.ctl-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--fg); }
.ctl-toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.btn { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; margin: 2px 4px 2px 0; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.lab-readout { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.ro { display: grid; gap: 1px; padding: 7px 10px; background: var(--panel); min-width: 0; }
.ro-lab { font-size: 11.5px; color: var(--muted); }
.ro-val { font-family: var(--mono-font); font-variant-numeric: tabular-nums; font-size: 13px; overflow-wrap: anywhere; }
.lab-hint { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.65; }
.lab-missing { padding: 18px; color: var(--muted); }


/* ---------- challenge (v2) ---------- */
.pills { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 0; }
.pill { font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
.pill-n { font-family: var(--mono-font); font-size: 11px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
.pill[data-state="cur"] { color: var(--fg); border-color: var(--fg); }
.pill[data-state="done"] { color: var(--fg); }
.pill[data-state="done"] .pill-n { background: var(--good); border-color: var(--good); color: var(--bg); }
.pill[data-state="cur"] .pill-n { border-color: var(--accent); color: var(--accent); }
.pill:disabled { opacity: .45; cursor: default; }
[hidden], .stage[hidden] { display: none !important; }
.stage { padding: 14px; display: grid; gap: 12px; min-width: 0; }
.stage > * { min-width: 0; max-width: 100%; }
.stage-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stage-k { font-family: var(--mono-font); font-size: 11px; letter-spacing: .14em; color: var(--accent); }
.stage-head h3 { font-family: var(--cjk-display); font-size: 19px; margin: 0; }
.stage-task { font-size: 14.5px; line-height: 1.75; max-width: 46em; }
.stage-task p { margin: 0 0 8px; }
.stage-body { display: grid; gap: 12px; min-width: 0; }
.stage-body > * { min-width: 0; max-width: 100%; }
.stage-fb { font-size: 13.5px; min-height: 0; }
.stage-fb:empty { display: none; }
.fb-good { color: var(--good); } .fb-bad { color: var(--warn); } .fb-info { color: var(--muted); }
.stage-hints { display: grid; gap: 6px; }
.stage-hints:empty { display: none; }
.hint { margin: 0; font-size: 13.5px; padding: 8px 12px; border-radius: 6px; background: var(--bg2); }
.hint b { color: var(--accent); font-weight: 600; margin-right: 4px; }
.stage-ans { font-size: 13.5px; padding: 10px 12px; border-radius: 6px; border: 1px dashed var(--line); }
.stage-ans b { color: var(--accent); }
.stage-foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.btn-ghost { background: none; color: var(--muted); }
.ans { display: grid; gap: 5px; }
.ans-lab { font-size: 13.5px; }
.ans-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ans-in { font: inherit; font-family: var(--mono-font); width: 10em; max-width: 100%; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.ans-unit { font-size: 13px; color: var(--muted); }
.ans-msg { font-size: 13px; } .ans-msg.good { color: var(--good); } .ans-msg.bad { color: var(--warn); }
.quiz { display: grid; gap: 8px; }
.quiz-q { font-size: 14px; }
.quiz-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.quiz-opt { font: inherit; font-size: 13.5px; text-align: left; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; line-height: 1.5; }
.quiz-opt:hover { border-color: var(--muted); }
.quiz-opt.picked[data-res="ok"] { border-color: var(--good); }
.quiz-opt.picked[data-res="no"] { border-color: var(--warn); }
.quiz-why { font-size: 13.5px; } .quiz-why.good { color: var(--good); } .quiz-why.bad { color: var(--warn); }
.dtable { overflow-x: auto; }
.dtable table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.dtable th, .dtable td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.dtable th { color: var(--muted); font-weight: 500; text-align: right; }
.dtable td:first-child, .dtable th:first-child { text-align: left; }


/* ---------- v2: progress, scenario, reveal ---------- */
.card h3 { font-size: 18px; }
.card .prog { display: flex; gap: 4px; margin-top: 4px; }
.card .prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.card .prog i.on { background: var(--good); }
.card .st { font-size: 12px; font-family: var(--mono-font); color: var(--muted); }

<script>/* core.js */
/* ===== core.js — shared helpers for every lab =====
 * Contract for a lab file (src/labs/<id>.js):
 *
 *   LABS.<id> = {
 *     title: '中文实验名',
 *     mount(root, ctx) { ...build DOM inside root...; return { destroy() {...} }; }
 *   };
 *
 * ctx = {
 *   color(name)   -> current value of a CSS token, e.g. ctx.color('--fg'). Theme can change at
 *                    any time, so read colors inside your draw function, not once at mount.
 *   reduced       -> true if the viewer prefers reduced motion (skip/slow ambient animation)
 *   h             -> the helpers below
 * }
 */
window.LABS = window.LABS || {};

const H = (() => {
  function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of [].concat(children)) {
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return e;
  }

  let uid = 0;
  const nid = (p) => `${p}-${++uid}`;

  /* Slider: returns {el, get(), set(v)}. format(v) -> string shown next to label. */
  function slider({ label, min, max, step = 1, value, format = (v) => v, onInput, id }) {
    id = id || nid('s');
    const out = el('output', { class: 'ctl-val', for: id });
    const input = el('input', { type: 'range', id, min, max, step, value });
    const wrap = el('div', { class: 'ctl ctl-slider' }, [
      el('label', { for: id, class: 'ctl-lab' }, [el('span', { text: label }), out]),
      input,
    ]);
    const show = () => (out.textContent = format(+input.value));
    input.addEventListener('input', () => { show(); onInput && onInput(+input.value); });
    show();
    return { el: wrap, input, get: () => +input.value, set: (v) => { input.value = v; show(); } };
  }

  /* Segmented choice: options = [{value,label}]. returns {el, get(), set(v)} */
  function choice({ label, options, value, onChange }) {
    let cur = value ?? options[0].value;
    const btns = options.map((o) =>
      el('button', { type: 'button', class: 'seg', 'aria-pressed': String(o.value === cur), text: o.label,
        onclick: () => { set(o.value); onChange && onChange(cur); } }));
    function set(v) { cur = v; btns.forEach((b, i) => b.setAttribute('aria-pressed', String(options[i].value === v))); }
    const wrap = el('div', { class: 'ctl ctl-choice' }, [
      label ? el('span', { class: 'ctl-lab', text: label }) : null,
      el('div', { class: 'segs', role: 'group' }, btns),
    ]);
    return { el: wrap, get: () => cur, set };
  }

  /* Checkbox toggle. returns {el, get(), set(b)} */
  function toggle({ label, value = false, onChange, id }) {
    id = id || nid('t');
    const input = el('input', { type: 'checkbox', id });
    input.checked = !!value;
    input.addEventListener('change', () => onChange && onChange(input.checked));
    const wrap = el('label', { class: 'ctl ctl-toggle', for: id }, [input, el('span', { text: label })]);
    return { el: wrap, get: () => input.checked, set: (b) => (input.checked = !!b) };
  }

  /* Button. kind: 'primary' | undefined */
  function button({ label, onClick, kind }) {
    return el('button', { type: 'button', class: 'btn' + (kind ? ' btn-' + kind : ''), text: label, onclick: onClick });
  }

  /* Readout row: returns {el, set(text)} */
  function readout(label, initial = '—') {
    const v = el('span', { class: 'ro-val', text: initial });
    return { el: el('div', { class: 'ro' }, [el('span', { class: 'ro-lab', text: label }), v]), set: (t) => (v.textContent = t) };
  }

  /* Hi-DPI canvas that tracks its container width.
   * aspect = height / width (e.g. 0.6). minH/maxH clamp CSS height in px.
   * returns { canvas, g (2d ctx in CSS px units), get w(), get h(), onResize(cb), destroy() } */
  function canvas(parent, { aspect = 0.6, minH = 180, maxH = 460, cls = '' } = {}) {
    const c = el('canvas', { class: 'lab-canvas ' + cls });
    parent.append(c);
    const g = c.getContext('2d');
    let W = 300, Hh = 180; const cbs = [];
    function fit() {
      const r = c.parentElement.getBoundingClientRect();
      W = Math.max(200, Math.floor(r.width));
      Hh = Math.round(Math.min(maxH, Math.max(minH, W * aspect)));
      const d = Math.min(window.devicePixelRatio || 1, 2);
      c.width = W * d; c.height = Hh * d; c.style.width = W + 'px'; c.style.height = Hh + 'px';
      g.setTransform(d, 0, 0, d, 0, 0);
      cbs.forEach((f) => f(W, Hh));
    }
    const ro = new ResizeObserver(() => fit());
    ro.observe(c.parentElement);
    fit();
    return {
      canvas: c, g,
      get w() { return W; }, get h() { return Hh; },
      onResize(f) { cbs.push(f); },
      destroy() { ro.disconnect(); },
    };
  }

  /* rAF loop: cb(dtSeconds, tSeconds). returns {stop(), start(), running} */
  function loop(cb) {
    let id = 0, last = 0, t = 0, running = false;
    function frame(ts) {
      const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts; t += dt;
      cb(dt, t); if (running) id = requestAnimationFrame(frame);
    }
    const api = {
      start() { if (!running) { running = true; last = 0; id = requestAnimationFrame(frame); } return api; },
      stop() { running = false; cancelAnimationFrame(id); return api; },
      get running() { return running; },
    };
    return api;
  }

  /* Simple axis helper for plots. Returns mapping functions and draws frame+ticks.
   * opts: {x0,x1,y0,y1, pad:{l,r,t,b}, xTicks:[...], yTicks:[...], xLabel, yLabel, fmtX, fmtY, logY} */
  function axes(g, W, Hh, o, color) {
    const p = Object.assign({ l: 46, r: 14, t: 14, b: 34 }, o.pad || {});
    const iw = W - p.l - p.r, ih = Hh - p.t - p.b;
    const X = (x) => p.l + ((x - o.x0) / (o.x1 - o.x0)) * iw;
    const Y = o.logY
      ? (y) => p.t + ih - ((Math.log10(Math.max(y, 1e-300)) - Math.log10(o.y0)) / (Math.log10(o.y1) - Math.log10(o.y0))) * ih
      : (y) => p.t + ih - ((y - o.y0) / (o.y1 - o.y0)) * ih;
    g.save();
    g.font = '11px ' + (color('--mono-font') || 'monospace');
    g.strokeStyle = color('--grid'); g.lineWidth = 1; g.fillStyle = color('--muted');
    g.textAlign = 'center'; g.textBaseline = 'top';
    (o.xTicks || []).forEach((t) => { const x = X(t); g.beginPath(); g.moveTo(x, p.t); g.lineTo(x, p.t + ih); g.stroke(); g.fillText((o.fmtX || String)(t), x, p.t + ih + 6); });
    g.textAlign = 'right'; g.textBaseline = 'middle';
    (o.yTicks || []).forEach((t) => { const y = Y(t); g.beginPath(); g.moveTo(p.l, y); g.lineTo(p.l + iw, y); g.stroke(); g.fillText((o.fmtY || String)(t), p.l - 6, y); });
    g.strokeStyle = color('--line'); g.strokeRect(p.l + 0.5, p.t + 0.5, iw, ih);
    g.fillStyle = color('--muted'); g.textAlign = 'center'; g.textBaseline = 'bottom';
    if (o.xLabel) g.fillText(o.xLabel, p.l + iw / 2, Hh - 1);
    if (o.yLabel) { g.save(); g.translate(11, p.t + ih / 2); g.rotate(-Math.PI / 2); g.textBaseline = 'middle'; g.fillText(o.yLabel, 0, 0); g.restore(); }
    g.restore();
    return { X, Y, p, iw, ih };
  }

  /* Wavelength (nm, 380–780) -> approximate visible sRGB string; outside range returns null */
  function wavelengthRGB(nm, alpha = 1) {
    let r = 0, gg = 0, b = 0;
    if (nm < 380 || nm > 780) return null;
    if (nm < 440) { r = -(nm - 440) / 60; b = 1; }
    else if (nm < 490) { gg = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { gg = 1; b = -(nm - 510) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; gg = 1; }
    else if (nm < 645) { r = 1; gg = -(nm - 645) / 65; }
    else { r = 1; }
    let f = nm < 420 ? 0.3 + 0.7 * (nm - 380) / 40 : nm > 700 ? 0.3 + 0.7 * (780 - nm) / 80 : 1;
    const c = (v) => Math.round(255 * Math.pow(v * f, 0.8));
    return `rgba(${c(r)},${c(gg)},${c(b)},${alpha})`;
  }

  return { el, slider, choice, toggle, button, readout, canvas, loop, axes, wavelengthRGB };
})();

/* ===== Challenge framework (v2) =====
 * Contract for a challenge file (src/challenges/<id>.js):
 *   CHALLENGES.<id> = { title: '中文名', mount(root, ctx) { return H.stages(root, ctx, [ ...stages ]); } };
 * A stage: { title, task (HTML, may contain $TeX$), hints: [HTML,...], answer: HTML (shown on give-up),
 *            build(body, api) -> optional { destroy() } }
 * api: done(msgHTML)        mark this stage solved (shows success + "下一关" button). Idempotent.
 *      say(html, kind)      feedback line under the body; kind: 'info' | 'good' | 'bad'
 *      typeset(node)        render $TeX$ inside node (call after inserting HTML that contains TeX)
 *      solved()             -> bool
 * ctx (from the page): color(), reduced, h, typeset(node), progress: {get() -> Set of solved indices, mark(i)}, onComplete()
 */
window.CHALLENGES = window.CHALLENGES || {};

H.stages = function (root, ctx, stages) {
  const el = H.el;
  const solved = new Set(ctx.progress ? ctx.progress.get() : []);
  const built = new Map(); // i -> {wrap, handle}
  let cur = 0;
  const pills = stages.map((s, i) => el('button', { type: 'button', class: 'pill', onclick: () => open(i) }, [el('span', { class: 'pill-n', text: String(i + 1) }), el('span', { class: 'pill-t', text: s.title })]));
  const strip = el('div', { class: 'pills', role: 'tablist' }, pills);
  const host = el('div', { class: 'stage-host' });
  root.append(strip, host);
  const ts = (n) => { if (ctx.typeset) ctx.typeset(n); };

  function refresh() {
    pills.forEach((p, i) => {
      const reachable = i === 0 || solved.has(i - 1) || solved.has(i);
      p.disabled = !reachable;
      p.setAttribute('aria-selected', String(i === cur));
      p.dataset.state = solved.has(i) ? 'done' : i === cur ? 'cur' : reachable ? 'open' : 'locked';
    });
  }
  function build(i) {
    const s = stages[i];
    const fb = el('div', { class: 'stage-fb', 'aria-live': 'polite' });
    const body = el('div', { class: 'stage-body' });
    const hintBox = el('div', { class: 'stage-hints' });
    const ansBox = el('div', { class: 'stage-ans', hidden: true });
    const next = el('button', { type: 'button', class: 'btn btn-primary', hidden: true, text: i < stages.length - 1 ? '下一关 →' : '揭晓完整故事 ↓', onclick: () => { if (i < stages.length - 1) open(i + 1); else if (ctx.onComplete) ctx.onComplete(true); } });
    let shown = 0;
    const hintBtn = el('button', { type: 'button', class: 'btn', text: s.hints && s.hints.length ? `提示 (0/${s.hints.length})` : '没有提示', disabled: !(s.hints && s.hints.length) });
    hintBtn.addEventListener('click', () => {
      if (shown >= s.hints.length) return;
      const p = el('p', { class: 'hint', html: `<b>提示 ${shown + 1}</b>　${s.hints[shown]}` });
      hintBox.append(p); ts(p); shown++;
      hintBtn.textContent = `提示 (${shown}/${s.hints.length})`; if (shown >= s.hints.length) hintBtn.disabled = true;
    });
    const giveUp = el('button', { type: 'button', class: 'btn btn-ghost', text: '放弃，看答案' });
    giveUp.addEventListener('click', () => { ansBox.hidden = false; ansBox.innerHTML = '<b>答案</b>　' + (s.answer || ''); ts(ansBox); api.done(null, true); giveUp.disabled = true; });
    const wrap = el('section', { class: 'stage', 'aria-label': s.title }, [
      el('div', { class: 'stage-head' }, [el('span', { class: 'stage-k', text: `第 ${i + 1} 关 / ${stages.length}` }), el('h3', { text: s.title })]),
      el('div', { class: 'stage-task', html: s.task }),
      body, fb, hintBox, ansBox,
      el('div', { class: 'stage-foot' }, [hintBtn, giveUp, next]),
    ]);
    const api = {
      done(msg, viaGiveUp) {
        if (!solved.has(i)) { solved.add(i); if (ctx.progress) ctx.progress.mark(i, !!viaGiveUp); }
        if (msg) api.say(msg, 'good');
        next.hidden = false; refresh();
        if (solved.size === stages.length && ctx.onComplete) ctx.onComplete(false);
      },
      say(html, kind = 'info') { fb.className = 'stage-fb fb-' + kind; fb.innerHTML = html; ts(fb); },
      typeset: ts,
      solved: () => solved.has(i),
    };
    if (solved.has(i)) { next.hidden = false; }
    host.append(wrap);
    let handle = null;
    try { handle = s.build(body, api) || null; } catch (e) { console.error(e); body.append(el('p', { class: 'lab-missing', text: '这一关加载失败。' })); }
    ts(wrap);
    built.set(i, { wrap, handle });
  }
  function open(i) {
    cur = i;
    if (!built.has(i)) build(i);
    built.forEach((b, k) => { b.wrap.hidden = k !== i; });
    refresh();
  }
  // start at first unsolved stage
  let start = 0; while (start < stages.length - 1 && solved.has(start)) start++;
  open(start);
  return { destroy() { built.forEach((b) => { try { b.handle && b.handle.destroy && b.handle.destroy(); } catch (e) {} }); } };
};

/* Numeric answer box. check(v) -> {ok:bool, msg:HTML}. Returns {el, input} */
H.answer = function ({ label, unit = '', placeholder = '', check, onOk, id }) {
  const el = H.el;
  id = id || 'ans-' + Math.random().toString(36).slice(2, 8);
  const input = el('input', { type: 'text', inputmode: 'decimal', id, placeholder, autocomplete: 'off', class: 'ans-in' });
  const msg = el('span', { class: 'ans-msg', 'aria-live': 'polite' });
  const go = () => {
    const raw = input.value.trim().replace(/×\s*10\^?/i, 'e').replace(/[，,]/g, '.');
    const v = Number(raw);
    if (raw === '' || !isFinite(v)) { msg.className = 'ans-msg bad'; msg.textContent = '请输入一个数字'; return; }
    const r = check(v) || {};
    msg.className = 'ans-msg ' + (r.ok ? 'good' : 'bad'); msg.innerHTML = r.msg || (r.ok ? '对了' : '不对，再想想');
    if (r.ok && onOk) onOk(v);
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  const wrap = el('div', { class: 'ans' }, [el('label', { for: id, class: 'ans-lab', html: label }), el('div', { class: 'ans-row' }, [input, unit ? el('span', { class: 'ans-unit', html: unit }) : null, H.button({ label: '检查', onClick: go })]), msg]);
  return { el: wrap, input };
};

/* Multiple-choice question. options: [{label(HTML), ok:bool, why(HTML)}]. Returns {el} */
H.quiz = function ({ question, options, onOk }) {
  const el = H.el;
  const why = el('div', { class: 'quiz-why', 'aria-live': 'polite' });
  const btns = options.map((o) => {
    const b = el('button', { type: 'button', class: 'quiz-opt', html: o.label });
    b.addEventListener('click', () => {
      btns.forEach((x) => x.classList.remove('picked'));
      b.classList.add('picked'); b.dataset.res = o.ok ? 'ok' : 'no';
      why.className = 'quiz-why ' + (o.ok ? 'good' : 'bad'); why.innerHTML = o.why || (o.ok ? '对。' : '不对。');
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([why]).catch(() => {});
      if (o.ok && onOk) onOk();
    });
    return b;
  });
  return { el: el('div', { class: 'quiz' }, [question ? el('div', { class: 'quiz-q', html: question }) : null, el('div', { class: 'quiz-opts' }, btns), why]) };
};

</script>
<script>/* marquez.js */
/* humanities/marquez.js — 马孔多，一百年
 * Gabriel García Márquez, Nobel Prize in Literature 1982.
 * Five chapters: magical realism as a change of viewpoint; cyclical time & names; the insomnia plague
 * (memory and language); the banana company and the 1928 massacre (history and erasure); solitude,

      const CH = [
        { title: '颠倒的惊奇', build: ch1, intro: '<p>魔幻现实主义常被误解成“往现实里撒一把魔法”。其实它做的是一件更根本的事：<b>换一双眼睛</b>。在马孔多，什么东西让人目瞪口呆，什么东西被当成家常便饭？</p><p>先凭<b>你自己</b>的直觉，把下面十二张牌分进两栏（拖动，或点牌上的按钮）。分完之后，再翻到马孔多人的视角。</p>' },

          '这正是 1982 年 12 月 8 日那篇演讲——《拉丁美洲的孤独》——的论证。转述其大意：欧洲的理性头脑习惯用衡量自己的尺子来衡量拉丁美洲，忘了他们自己的历史也曾漫长而血腥；用别人的尺子解读我们的现实，只会让我们更不为人知、更不自由、<b>更孤独</b>。他也拒绝把这片大陆的暴力简单归结为外来的阴谋，认为它扎根于积累了几个世纪的不公；他希望远方的同情能变成实际的支持。',

.mandela-case { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.mandela-case > * { min-width: 0; }
.mandela-case p { margin: 0; font-size: 14px; line-height: 1.75; }
.mandela-case-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.mandela-case-h b { font-family: var(--cjk-display); font-size: 16px; }
.mandela-case-res { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.mandela-crit { display: flex; flex-wrap: wrap; gap: 6px; }
.mandela-crit span { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); }
.mandela-crit span.ok { border-color: var(--good); } .mandela-crit span.no { border-color: var(--warn); } .mandela-crit span.q { border-style: dashed; }
.mandela-crit span.ok b { color: var(--good); } .mandela-crit span.no b { color: var(--warn); } .mandela-crit span.q b { color: var(--muted); }
.mandela-fam { color: var(--muted); font-size: 13.5px !important; }
.mandela-fam b { color: var(--fg); }
.mandela-stats { display: grid; gap: 10px; }
.mandela-stats h4, .mandela-landbox h4, .mandela-people h4, .mandela-cmpwrap h4 { font-family: var(--cjk-display); font-size: 16px; margin: 0; }
.mandela-waffle { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; max-width: 420px; }
.mandela-waffle i { aspect-ratio: 1; border-radius: 2px; display: block; }
.mandela-legend span i { border-radius: 2px; }
.mandela-list { margin: 0; padding-left: 1.2em; font-size: 13.5px; line-height: 1.75; }
.mandela-list li { margin-bottom: 4px; }
.mandela-landbox { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.mandela-landrow { display: grid; gap: 4px; font-size: 13px; }
.mandela-hbar { display: flex; align-items: center; gap: 8px; height: 14px; }
.mandela-hbar i { display: block; height: 100%; border-radius: 3px; }
.mandela-hbar b { font-family: var(--mono-font); font-size: 12px; font-weight: 600; white-space: nowrap; }
.mandela-people { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.mandela-people > div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
.mandela-people p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.75; }
.mandela-svgwrap { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.mandela-svg { display: block; width: 100%; height: auto; }
.mandela-svg .m-floor { stroke: var(--line); stroke-width: 2; }
.mandela-svg .m-wall { fill: var(--muted); transition: opacity .6s; }
.mandela-svg .m-table rect { fill: var(--muted); }
.mandela-svg .m-table, .mandela-svg .m-ballot { transition: opacity .6s; }
.mandela-svg .m-ballot rect { fill: var(--accent); }
.mandela-svg .m-ballot .m-slot { fill: var(--panel); }
.mandela-svg .m-ballot .m-paper { fill: var(--fg); }
.mandela-svg .m-chair { transition: transform .8s cubic-bezier(.4,.1,.2,1); }
.mandela-svg .m-chair.l rect { fill: var(--s1); } .mandela-svg .m-chair.r rect { fill: var(--s2); }
.mandela-svg .m-chair.empty rect { fill: none; stroke: var(--s1); stroke-dasharray: 3 3; }
.mandela-svg .m-medal { fill: var(--accent); transition: opacity .6s; }
.mandela-svg .m-lab { fill: var(--fg); font-size: 13px; font-family: var(--body-font); }
.mandela-svgwrap.still .m-chair, .mandela-svgwrap.still .m-wall, .mandela-svgwrap.still .m-table, .mandela-svgwrap.still .m-ballot, .mandela-svgwrap.still .m-medal { transition: none; }
.mandela-svgctl { display: flex; align-items: center; gap: 8px; }
.mandela-range { flex: 1; min-width: 0; accent-color: var(--accent); }
.mandela-cmpwrap { display: grid; gap: 10px; }
.mandela-cmp { padding: 10px 12px; border-radius: 8px; background: var(--bg2); display: grid; gap: 4px; }
.mandela-cmp p { margin: 0; font-size: 13.5px; }
.mandela-cmp-h b { font-family: var(--cjk-display); font-size: 15px; }
.mandela-cmpwrap .dtable td, .mandela-cmpwrap .dtable th { text-align: left; white-space: normal; min-width: 7em; vertical-align: top; }
.mandela-cmpwrap .dtable td:first-child { min-width: 3em; font-family: var(--mono-font); }
.mandela-cmpwrap .dtable table { min-width: 560px; }
`;
})();

</script>
<script>/* hum_app.js */
/* hum_app.js — standalone preview shell for the Literature & Peace experiences */
(() => {
  const el = H.el;
  const app = document.getElementById('app');
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const typeset = (node) => { const mj = window.MathJax; if (mj && mj.typesetPromise) mj.typesetPromise([node]).catch(() => {}); };
  let handle = null;

  const ITEMS = [
    {
      id: 'marquez', field: 'lit', fieldName: '文学奖', year: 1982,
      who: [{ zh: '加夫列尔·加西亚·马尔克斯', en: 'Gabriel García Márquez' }],
      teaser: '一个虚构的小镇，怎样装下一整片大陆的百年？',
      blurb: '五幕：颠倒的惊奇、名字的轮回、失眠症、香蕉公司、孤独与第二次机会。你会分拣奇迹、预言一个家族的命运、和遗忘赛跑，并亲眼看着一段历史被抹掉。',
      cite: '瑞典学院表彰他的长篇与短篇小说，其中幻想与现实交织成一个丰富的想象世界，映照出一片大陆的生活与冲突。',
    },
    {
      id: 'mandela', field: 'peace', fieldName: '和平奖', year: 1993,
      who: [{ zh: '纳尔逊·曼德拉', en: 'Nelson Mandela' }, { zh: '弗雷德里克·威廉·德克勒克', en: 'F. W. de Klerk' }],
      teaser: '两个敌人，怎样在四年里把一个国家从种族隔离谈到一人一票？',
      blurb: '五幕：先看种族隔离怎样用法律分配土地、居所与公民身份；再坐上谈判桌扮演其中一方，在暗杀、屠杀与右翼冲击中把选举谈下来；然后审理真相与和解委员会的案子，看 30 年后什么变了、什么没变。',
      cite: '挪威诺贝尔委员会表彰两人为和平结束种族隔离制度、为一个新的民主南非奠定基础所做的工作。',
    },
  ];
  const byId = Object.fromEntries(ITEMS.map((x) => [x.id, x]));

  function home() {
    document.title = '文学与和平';
    const cards = ITEMS.map((x) => el('a', { class: 'hcard f-' + x.field, href: '#' + x.id }, [
      el('div', { class: 'row' }, [el('span', { class: 'yr', text: x.year }), el('span', { class: 'chip', text: '诺贝尔' + x.fieldName })]),
      el('h3', { text: x.teaser }),
      el('div', { class: 'who', text: x.who.map((w) => w.zh).join('、') }),
      el('p', { class: 'one', text: x.blurb }),
      el('span', { class: 'go', text: '进入 →' }),
    ]));
    app.replaceChildren(
      el('section', { class: 'hero hum-hero' }, [
        el('div', {}, [
          el('div', { class: 'kicker', text: 'Nobel · 文学 / 和平' }),
          el('h1', { html: '<span class="nw">不是读懂，</span><br><span class="nw">而是<em>走进去</em></span>' }),
          el('p', { text: '科学奖可以被还原，文学奖和和平奖不行：它们没有标准答案。这里用小游戏和互动动画，让你站进作品和那段历史里，体会它背后的意义，以及它带来的社会与文化变迁。' }),
        ]),
      ]),
      el('div', { class: 'hgrid' }, cards),
      el('p', { class: 'foot', text: '内容由 Claude 整理，史实已核对，有争议的数字给出范围；标注“简化模型”“示意”“虚构的综合案例”的部分是为了互动而做的简化。作品原文受版权保护，页面中只有转述，没有引文。' }),
    );
  }

  function detail(x) {
    document.title = `${x.year} · ${HUM[x.id] ? HUM[x.id].title : x.teaser}`;
    const root = el('div', { class: 'humroot' });
    app.replaceChildren(
      el('div', { class: 'crumbs' }, [el('a', { href: '#', text: '← 文学与和平' }), el('div', { class: 'pn' }, ITEMS.filter((o) => o !== x).map((o) => el('a', { href: '#' + o.id, text: `${o.year} ${o.fieldName} →` })))]),
      el('header', { class: 'dhead f-' + x.field }, [
        el('div', { class: 'bigyr', text: x.year }),
        el('div', { class: 'meta' }, [el('span', { class: 'chip', text: '诺贝尔' + x.fieldName })]),
        el('h1', { text: x.teaser }),
        el('div', { class: 'laureates' }, x.who.map((w) => el('div', {}, [el('b', { text: w.zh }), el('span', { text: w.en })]))),
      ]),
      root,
    );
    if (HUM[x.id]) {
      try { handle = HUM[x.id].mount(root, { color: css, reduced, h: H, typeset }); }
      catch (err) { console.error(err); root.replaceChildren(el('p', { class: 'lab-missing', text: '加载失败，请刷新页面重试。' })); }
    }
    typeset(app);
  }

  function route() {
    if (handle) { try { handle.destroy(); } catch (e) {} handle = null; }
    const x = byId[location.hash.replace(/^#/, '')];
    if (x) detail(x); else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
